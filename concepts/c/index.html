<script>
const DATA_BASE = '../../';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const you = v => String(v ?? '').replace(/Peter/g,'你');
const safeUrl = v => { try { const u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch { return ''; } };
const fmtDate = v => { const d = new Date(v); return Number.isNaN(+d) ? '' : new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(d); };
const fmtMinutes = n => { const m = Math.round(Number(n)||0); return m >= 60 ? `${Math.floor(m/60)}小时${m%60 ? m%60+'分' : ''}` : `${m}分钟`; };
const fmtNum = n => { const v=Number(n)||0; return v>=1000000?(v/1000000).toFixed(1)+'百万':v>=10000?(v/10000).toFixed(1)+'万':Math.round(v).toLocaleString('zh-CN'); };
const today = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const spaces=[['sales','销售','◫','行业与竞品，对销售意味着什么'],['explore','探索','✧','值得试的工具与 AI 动向'],['mine','我的','▥','你的 AI 使用趋势'],['methods','方法','▤','反复验证过的做法']];
const S={data:null,picks:null,brief:null,playbook:null,personal:[],news:null,space:'sales',period:'day',pickFilter:'all',methodFilter:'全部',searchOpen:false,drawerOpen:false};
const getSet = key => { try { return new Set(JSON.parse(localStorage.getItem('proto-'+key)||'[]')); } catch { return new Set(); } };
const putSet = (key,set) => localStorage.setItem('proto-'+key,JSON.stringify([...set]));
const state = {read:getSet('read'),saved:getSet('saved'),later:getSet('later')};
function toggleState(kind,id){ const set=state[kind]; set.has(id)?set.delete(id):set.add(id); putSet(kind,set); renderSpace(); if(S.drawerOpen) renderDrawer(); toast(({read:'已更新阅读状态',saved:'已更新收藏',later:'已更新稍后'})[kind]); }
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
async function loadJson(name){try{const r=await fetch(DATA_BASE+name,{cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}catch{return null}}
function loadPersonal(){try{const v=JSON.parse(localStorage.getItem('wb-playbook')||'{}');return Array.isArray(v.items)?v.items:[]}catch{return []}}
const dateNow = () => new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());
function latestDay(){const arr=S.data?.daily||[];return arr.findLast?.(x=>x.date===today)||arr.find(x=>x.date===today)||null}
function dayMetrics(){const d=latestDay();return d||((S.data?.periods?.day?.from===today)?S.data.periods.day:null)}
function datedBrief(){return S.brief?.date===today ? S.brief.items||[] : []}
function validPicks(){return (S.picks?.items||[]).filter(x=>(Number(x.ai?.fit)||0)>1).sort((a,b)=>(Number(b.ai?.fit)||0)-(Number(a.ai?.fit)||0)||(Number(b.growth?.per_day)||0)-(Number(a.growth?.per_day)||0))}
function allMethods(){const a=S.playbook?.items||[];return [...S.personal.map((x,i)=>({...x,id:x.id||'local-'+i,origin:'我的'})),...a.map(x=>({...x,origin:'每周整理'}))].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))}
function weekMethods(){const now=new Date(today+'T12:00:00+08:00');const day=(now.getDay()+6)%7;const monday=new Date(now.getTime()-day*86400000).toISOString().slice(0,10);return allMethods().filter(x=>String(x.created_at||'').slice(0,10)>=monday)}
function weekAvg(){const d=S.data?.daily||[];const now=new Date(today+'T12:00:00+08:00');const monday=new Date(now.getTime()-((now.getDay()+6)%7)*86400000).toISOString().slice(0,10);const rows=d.filter(x=>x.date>=monday&&x.date<=today);return rows.length?rows.reduce((n,x)=>n+(Number(x.total?.minutes)||0),0)/rows.length:null}
function miniBars(){const arr=(S.data?.daily||[]).filter(x=>x.date<=today).slice(-7),max=Math.max(1,...arr.map(x=>Number(x.total?.minutes)||0));return `<span class="mini-bars" aria-hidden="true">${arr.map(x=>`<i style="height:${Math.max(3,Math.round((Number(x.total?.minutes)||0)/max*30))}px"></i>`).join('')}</span>`}
function renderHeader(){const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(new Date()));$('#greeting').textContent=hour<11?'早上好，志鹏':hour<18?'下午好，志鹏':'晚上好，志鹏';$('#dateLabel').textContent=dateNow();$('#spaceDate').textContent='数据会随本地文件更新';const comp=datedBrief().filter(x=>x.tag==='竞品').length;const d=dayMetrics(),avg=weekAvg();const diff=d&&avg?Math.round(((Number(d.total?.minutes)||0)/avg-1)*100):null;let parts=[];if(S.brief&&S.brief.date!==today)parts.push('简报尚未更新到今天');else if(comp)parts.push(`今天有 ${comp} 条竞品动态值得看`);if(d&&diff!==null)parts.push(`AI 用量较本周有记录日均${diff>=0?'高':'低'} ${Math.abs(diff)}%`);else if(d)parts.push(`AI 使用 ${fmtMinutes(d.total?.minutes)}`);$('#judgement').innerHTML=parts.length?parts.map(esc).join('，')+'。':'本地数据已就绪，选择一个空间开始。';$('#syncText').textContent='本地数据 · '+(S.data?.updated_at?fmtDate(S.data.updated_at):'按需读取')}
function renderNav(){const item=([id,name,icon])=>`<button data-space="${id}" class="${S.space===id?'active':''}" ${S.space===id?'aria-current="page"':''}><span class="icon">${icon}</span>${name}</button>`;$('#sideNav').innerHTML=spaces.map(item).join('');$('#bottomNav').innerHTML=spaces.map(item).join('');$('#segments').innerHTML=spaces.map(([id,name,icon])=>`<button role="tab" aria-selected="${S.space===id}" class="${S.space===id?'active':''}" data-space="${id}">${icon} ${name}</button>`).join('');$('#spaceIntro').textContent=spaces.find(x=>x[0]===S.space)?.[3]||''}
function renderSummary(){const d=dayMetrics(),avg=weekAvg(),m=d?.total?.minutes,cmp=datedBrief().filter(x=>x.tag==='竞品'),pick=validPicks()[0],wk=weekMethods(),diff=m!=null&&avg?Math.round((m/avg-1)*100):null;const usageText=!S.data?'暂无数据':d?fmtMinutes(m):'无记录';const usageSub=!S.data?'用量文件未读取':d&&diff!==null?`较本周有记录日均 ${diff>=0?'+':''}${diff}%`:d?'今天的 AI 使用':'今天暂无用量记录';$('#summaryGrid').innerHTML=`
<button class="summary-card" data-open="usage"><span class="card-top">AI 用量 <span class="card-symbol">↗</span></span><span class="big-number">${esc(usageText)}</span><span class="card-desc">${esc(usageSub)}</span><span class="card-foot">${miniBars()}<span>查看趋势 →</span></span></button>
<button class="summary-card" data-open="competitors"><span class="card-top">竞品 <span class="card-symbol">◉</span></span><span class="big-number">${S.brief?cmp.length+' 条':'暂无数据'}</span><span class="card-desc">${cmp.length?esc(cmp.map(x=>x.source).join(' · ')):(S.brief?'今天没有竞品动态':'简报文件未读取')}</span><span class="card-foot"><span class="badge-soft">今日简报</span><span>查看全部 →</span></span></button>
<button class="summary-card" data-open="toptool"><span class="card-top">值得试的工具 <span class="card-symbol">✧</span></span><span class="big-number tool-name">${pick?esc(pick.name):'暂无数据'}</span><span class="card-desc">${pick?esc(you(pick.ai?.zh||pick.desc)):'精选文件未读取'}</span><span class="card-foot"><span>适合度</span>${pick?`<span class="fit-ring" style="--fit:${(Number(pick.ai?.fit)||0)*20}%" data-fit="${esc(pick.ai?.fit)}/5"></span>`:''}</span></button>
<button class="summary-card" data-open="weekmethods"><span class="card-top">本周方法 <span class="card-symbol">▤</span></span><span class="big-number">${S.playbook||S.personal.length?wk.length+' 条':'暂无数据'}</span><span class="card-desc">${wk.length?esc([...new Set(wk.map(x=>x.category))].slice(0,2).join(' · ')):'本周暂无新方法'}</span><span class="card-foot"><span class="badge-soft">可直接复制</span><span>打开方法库 →</span></span></button>`}
function briefId(x){return 'brief:'+x.title}function pickId(x){return 'pick:'+x.name}function methodId(x){return 'method:'+x.id}
function renderSales(){if(!S.brief)return '<div class="muted-empty">暂无数据</div>';const items=datedBrief();if(!items.length)return '<div class="muted-empty">暂无数据</div>';const feature=items[0],rest=items.slice(1);return `<div class="panel-grid"><div class="stack"><article class="feature-card"><span class="tag">${esc(feature.tag)}</span><span class="meta" style="margin-left:8px">${esc(feature.source)} · ${esc(fmtDate(S.brief.date))}</span><h3>${esc(feature.title)}</h3><p>${esc(feature.summary)}</p><div class="why"><b>对销售的意义</b><br>${esc(feature.why)}</div><button class="row-link" data-detail="brief" data-index="0" style="border:0;background:none;padding:0;width:100%;text-align:left">查看详情 <span>↗</span></button></article><div class="small-info"><h3>今天的判断</h3><p>${items.filter(x=>x.tag==='竞品').length} 条竞品动态与 ${items.filter(x=>x.tag==='客户行业').length} 条客户行业消息。先看能转化成客户问题的内容。</p></div></div><div class="list-card"><h3>今日简报 <span class="meta">${items.length} 条</span></h3>${rest.map((x,i)=>`<button class="news-row" data-detail="brief" data-index="${i+1}"><span class="row-main"><span class="row-title">${esc(x.title)}</span><span class="row-sub">${esc(x.tag)} · ${esc(x.source)}</span></span><span class="row-arrow">↗</span></button>`).join('')}</div></div>`}
function pickCard(x,i){const id=pickId(x);return `<article class="pick-tile"><div><span class="tag ${x.track==='work'?'green':''}">${x.track==='work'?'工作相关':'适合度 '+esc(x.ai?.fit)+'/5'}</span>${x.track==='work'?`<span class="meta" style="margin-left:8px">适合度 ${esc(x.ai?.fit)}/5</span>`:''}</div><h3><button data-detail="pick" data-index="${i}" style="border:0;background:transparent;padding:0;text-align:left;color:inherit;font-weight:inherit">${esc(x.name)}</button></h3><p>${esc(you(x.ai?.zh||x.desc))}</p><div class="tile-foot"><span>★ ${fmtNum(x.stars)} · ${x.growth?.per_day!=null?'日增 '+fmtNum(x.growth.per_day):'增长未知'}</span><span class="tile-actions"><button class="icon-btn ${state.saved.has(id)?'on':''}" data-toggle="saved" data-id="${esc(id)}" aria-label="收藏 ${esc(x.name)}" title="收藏">${state.saved.has(id)?'♥':'♡'}</button><button class="icon-btn ${state.later.has(id)?'on':''}" data-toggle="later" data-id="${esc(id)}" aria-label="稍后看 ${esc(x.name)}" title="稍后看">◷</button></span></div></article>`}
function renderExplore(){if(!S.picks)return '<div class="muted-empty">暂无数据</div>';const picks=validPicks();const shown=picks.filter(x=>S.pickFilter==='all'||(S.pickFilter==='work'?x.track==='work':S.pickFilter==='saved'?state.saved.has(pickId(x)):state.later.has(pickId(x))));const chips=[['all','全部'],['work','工作相关'],['saved','已收藏'],['later','稍后']];return `<div class="filter-row">${chips.map(([id,label])=>`<button class="chip ${S.pickFilter===id?'active':''}" data-pick-filter="${id}">${label}</button>`).join('')}</div>${shown.length?`<div class="pick-list">${shown.map(x=>pickCard(x,picks.indexOf(x))).join('')}</div>`:'<div class="muted-empty">暂无数据</div>'}${S.news?.length?`<div class="small-info" style="margin-top:16px"><h3>AI 资讯</h3>${S.news.slice(0,4).map(x=>`<a class="news-row" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"><span class="row-main"><span class="row-title">${esc(x.title)}</span></span><span class="row-arrow">↗</span></a>`).join('')}</div>`:''}`}
function calendarRows(){const map=new Map((S.data?.daily||[]).map(x=>[x.date,x]));const base=new Date(today+'T12:00:00+08:00');return Array.from({length:30},(_,i)=>{const d=new Date(base.getTime()-(29-i)*86400000);const key=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);return {date:key,row:map.get(key)}})}
function renderMine(){if(!S.data)return '<div class="muted-empty">暂无数据</div>';const period=S.data.periods?.[S.period],rows=calendarRows(),max=Math.max(1,...rows.map(x=>Number(x.row?.total?.minutes)||0));const valid=rows.filter(x=>x.row),total=period?.total?.minutes;const current=dayMetrics(),avg=weekAvg();let note='近 30 天有 '+valid.length+' 天留下用量记录；空白日期表示无记录。';if(current&&avg){const delta=Math.round((Number(current.total?.minutes||0)/avg-1)*100);note=`今天用量较本周有记录日均${delta>=0?'高':'低'} ${Math.abs(delta)}%。`+note}return `<div class="chart-card"><div class="chart-head"><div><div class="eyebrow">AI USAGE</div><h3>使用趋势</h3><div class="chart-total">${period?esc(fmtMinutes(total)):'暂无数据'}</div><div class="chart-sub">${{day:'今天',week:'本周',month:'本月'}[S.period]}合计</div></div><div class="periods" role="group" aria-label="用量区间">${['day','week','month'].map(x=>`<button class="${S.period===x?'active':''}" data-period="${x}">${{day:'日',week:'周',month:'月'}[x]}</button>`).join('')}</div></div><div class="chart" role="img" aria-label="近30天网页、终端、桌面用量堆叠柱状图，空白表示无记录">${rows.map(({date,row})=>{if(!row)return `<div class="chart-day missing" title="${date}：无记录"></div>`;const parts=['desktop_total','cli_total','web_total'].map(k=>Number(row[k]?.minutes)||0),sum=parts.reduce((a,b)=>a+b,0),height=Math.max(2,Math.round(sum/max*185));return `<div class="chart-day" title="${date}：${fmtMinutes(row.total?.minutes)}"><div class="bar-stack" style="height:${height}px">${parts.map((v,i)=>`<span class="${['bar-desk','bar-cli','bar-web'][i]}" style="height:${sum?v/sum*100:0}%"></span>`).join('')}</div></div>`}).join('')}</div><div class="chart-axis"><span>${fmtDate(rows[0].date)}</span><span>${fmtDate(rows[14].date)}</span><span>${fmtDate(rows[29].date)}</span></div><div class="legend"><span><i style="background:#6dc5b5"></i>网页</span><span><i style="background:#878de5"></i>终端</span><span><i style="background:#c7c1ee"></i>桌面</span><span>空白 = 无记录</span></div><div class="trend-note">${esc(note)}</div><div class="detail-stats"><div class="detail-stat"><b>${esc(fmtMinutes(period?.web_total?.minutes))}</b><span>网页</span></div><div class="detail-stat"><b>${esc(fmtMinutes(period?.cli_total?.minutes))}</b><span>终端</span></div><div class="detail-stat"><b>${esc(fmtMinutes(period?.desktop_total?.minutes))}</b><span>桌面</span></div></div><div class="meta" style="margin-top:15px">Token ${fmtNum(period?.total?.tokens)} · 使用时长为来源数据估算</div></div>`}
function renderMethods(){if(!S.playbook&&!S.personal.length)return '<div class="muted-empty">暂无数据</div>';const all=allMethods(),cats=['全部',...new Set(all.map(x=>x.category).filter(Boolean))];const shown=all.filter(x=>S.methodFilter==='全部'||x.category===S.methodFilter);return `<div class="filter-row">${cats.map(x=>`<button class="chip ${S.methodFilter===x?'active':''}" data-method-filter="${esc(x)}">${esc(x)}</button>`).join('')}</div>${shown.length?`<div class="method-list">${shown.map(x=>{const i=all.indexOf(x);return `<article class="method-tile"><div><span class="tag green">${esc(x.category||'未分类')}</span> <span class="meta">${esc(x.origin)}</span></div><h3><button data-detail="method" data-index="${i}" style="border:0;background:transparent;padding:0;text-align:left;color:inherit;font-weight:inherit">${esc(x.title)}</button></h3><p>${esc(x.text)}</p><div class="tile-foot"><span>${esc(fmtDate(x.created_at))}</span><button class="action-btn" data-copy="${i}">复制方法</button></div></article>`}).join('')}</div>`:'<div class="muted-empty">暂无数据</div>'}`}
function renderSpace(){renderNav();const fn={sales:renderSales,explore:renderExplore,mine:renderMine,methods:renderMethods}[S.space];const el=$('#spaceContent');el.innerHTML=fn();el.classList.remove('space-panel');void el.offsetWidth;el.classList.add('space-panel');if(S.space==='explore'&&S.news===null)loadNews()}
async function loadNews(){S.news=[];try{const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),4000);const r=await fetch('https://aihot.news/api/v1',{signal:ctl.signal});clearTimeout(timer);if(!r.ok)return;const v=await r.json();const arr=Array.isArray(v)?v:Array.isArray(v.items)?v.items:Array.isArray(v.data)?v.data:[];S.news=arr.filter(x=>x&&x.title&&safeUrl(x.url));if(S.space==='explore'&&S.news.length)renderSpace()}catch{} }
function block(title,content){return content?`<div class="drawer-block"><h4>${esc(title)}</h4><p>${esc(you(content)).replace(/\n/g,'<br>')}</p></div>`:''}
let drawerRef=null;
function renderDrawer(){if(!drawerRef)return;const {type,index}=drawerRef;let html='';if(type==='brief'){const x=datedBrief()[index];if(!x)return;const id=briefId(x);html=`<span class="tag">${esc(x.tag)}</span><h2>${esc(x.title)}</h2><div class="meta">${esc(x.source)} · ${esc(fmtDate(S.brief.date))}</div>${block('摘要',x.summary)}${block('对销售的意义',x.why)}<div class="drawer-actions"><button class="action-btn" data-toggle="read" data-id="${esc(id)}">${state.read.has(id)?'✓ 已读':'标为已读'}</button><button class="action-btn" data-toggle="saved" data-id="${esc(id)}">${state.saved.has(id)?'♥ 已收藏':'♡ 收藏'}</button>${safeUrl(x.url)?`<a class="action-btn primary" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">查看来源 ↗</a>`:''}</div>`}
else if(type==='pick'){const x=validPicks()[index];if(!x)return;const id=pickId(x);html=`<span class="tag">适合度 ${esc(x.ai?.fit)}/5</span><h2>${esc(x.name)}</h2><div class="meta">★ ${fmtNum(x.stars)} · 日增 ${fmtNum(x.growth?.per_day)} · ${esc(fmtDate(x.picked))}</div>${block('是什么',x.ai?.what||x.ai?.zh||x.desc)}${block('为什么值得看',x.ai?.why)}${block('怎么开始',x.ai?.setup)}${block('使用方式',x.ai?.how)}${block('许可提醒',x.quality?.license_note)}<div class="drawer-actions"><button class="action-btn" data-toggle="saved" data-id="${esc(id)}">${state.saved.has(id)?'♥ 已收藏':'♡ 收藏'}</button><button class="action-btn" data-toggle="later" data-id="${esc(id)}">${state.later.has(id)?'✓ 已加入稍后':'◷ 稍后看'}</button>${safeUrl(x.url)?`<a class="action-btn primary" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">打开 GitHub ↗</a>`:''}</div>`}
else if(type==='method'){const x=allMethods()[index];if(!x)return;html=`<span class="tag green">${esc(x.category||'方法')}</span><h2>${esc(x.title)}</h2><div class="meta">${esc(x.origin)} · ${esc(fmtDate(x.created_at))}</div>${block('方法内容',x.text)}<div class="drawer-actions"><button class="action-btn primary" data-copy="${index}">复制方法</button></div>`}
else if(type==='usage'){html=`<span class="tag">AI 用量</span><h2>今天的使用状态</h2>${block('今日合计',dayMetrics()?fmtMinutes(dayMetrics().total?.minutes):'无记录')}${block('本周趋势',weekAvg()?`本周有记录日均 ${fmtMinutes(weekAvg())}。未出现的日期不纳入平均。`:'暂无数据')}<div class="drawer-actions"><button class="action-btn primary" data-space="mine">查看完整趋势 →</button></div>`}
else if(type==='competitors'){const items=datedBrief().filter(x=>x.tag==='竞品');html=`<span class="tag">竞品</span><h2>今日竞品动态</h2>${items.length?items.map(x=>`<div class="drawer-block"><h4>${esc(x.source)}</h4><p>${esc(x.title)}</p><div class="drawer-actions"><button class="action-btn" data-detail="brief" data-index="${datedBrief().indexOf(x)}">查看详情 →</button></div></div>`).join(''):'<p>暂无数据</p>'}`}
else if(type==='toptool'){const x=validPicks()[0];if(x){drawerRef={type:'pick',index:0};return renderDrawer()}html='<p>暂无数据</p>'}
else if(type==='weekmethods'){html=`<span class="tag green">本周方法</span><h2>本周新方法</h2>${weekMethods().length?weekMethods().map(x=>`<div class="drawer-block"><h4>${esc(x.category)}</h4><p>${esc(x.title)}</p><div class="drawer-actions"><button class="action-btn" data-detail="method" data-index="${allMethods().findIndex(m=>m.id===x.id&&m.origin===x.origin)}">查看方法 →</button></div></div>`).join(''):'<p>暂无数据</p>'}<div class="drawer-actions"><button class="action-btn primary" data-space="methods">打开方法库 →</button></div>`}
$('#drawerContent').innerHTML=html}
function openDrawer(type,index=0){drawerRef={type,index:Number(index)};S.drawerOpen=true;renderDrawer();$('#backdrop').classList.add('open');$('#drawer').classList.add('open');document.body.style.overflow='hidden';$('#drawerClose').focus()}
function closeOverlays(){S.drawerOpen=false;S.searchOpen=false;$('#drawer').classList.remove('open');$('#searchBox').classList.remove('open');$('#backdrop').classList.remove('open');document.body.style.overflow=''}
function openSearch(){closeOverlays();S.searchOpen=true;$('#backdrop').classList.add('open');$('#searchBox').classList.add('open');document.body.style.overflow='hidden';$('#searchInput').value='';renderSearch();$('#searchInput').focus()}
function renderSearch(){const q=$('#searchInput').value.trim().toLocaleLowerCase();const sources=[...datedBrief().map((x,i)=>({type:'brief',index:i,title:x.title,sub:'简报 · '+x.tag})),...validPicks().map((x,i)=>({type:'pick',index:i,title:x.name,sub:'工具 · '+you(x.ai?.zh||'')})),...allMethods().map((x,i)=>({type:'method',index:i,title:x.title,sub:'方法 · '+x.category}))];const results=q?sources.filter(x=>(x.title+' '+x.sub).toLocaleLowerCase().includes(q)).slice(0,12):sources.slice(0,7);$('#searchResults').innerHTML=`<div class="search-hint">${q?`${results.length} 个结果`:'快速打开'}</div>${results.length?results.map(x=>`<button class="search-row" data-detail="${x.type}" data-index="${x.index}"><span class="row-main"><span class="row-title">${esc(x.title)}</span><span class="row-sub">${esc(x.sub)}</span></span><span class="row-arrow">↗</span></button>`).join(''):'<div class="muted-empty">暂无结果</div>'}`}
async function copyMethod(index){const x=allMethods()[Number(index)];if(!x)return;try{await navigator.clipboard.writeText(`${x.title}\n${x.text}`);toast('方法已复制')}catch{toast('复制失败，请在详情中手动复制')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-space],[data-open],[data-detail],[data-toggle],[data-period],[data-pick-filter],[data-method-filter],[data-copy]');if(!t)return;if(t.dataset.space){S.space=t.dataset.space;closeOverlays();renderSpace();if(innerWidth<701)document.querySelector('.spaces').scrollIntoView({behavior:'smooth',block:'start'});return}if(t.dataset.open){openDrawer(t.dataset.open);return}if(t.dataset.detail){openDrawer(t.dataset.detail,t.dataset.index);return}if(t.dataset.toggle){toggleState(t.dataset.toggle,t.dataset.id);return}if(t.dataset.period){S.period=t.dataset.period;renderSpace();return}if(t.dataset.pickFilter){S.pickFilter=t.dataset.pickFilter;renderSpace();return}if(t.dataset.methodFilter){S.methodFilter=t.dataset.methodFilter;renderSpace();return}if(t.dataset.copy)copyMethod(t.dataset.copy)});
$('#searchTrigger').addEventListener('click',openSearch);$('#searchClose').addEventListener('click',closeOverlays);$('#drawerClose').addEventListener('click',closeOverlays);$('#backdrop').addEventListener('click',closeOverlays);$('#searchInput').addEventListener('input',renderSearch);document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();S.searchOpen?closeOverlays():openSearch()}if(e.key==='Escape')closeOverlays()});let touchY=0;$('#drawer').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});$('#drawer').addEventListener('touchend',e=>{if(innerWidth<701&&e.changedTouches[0].clientY-touchY>110&&$('#drawerContent').scrollTop===0)closeOverlays()},{passive:true});
async function init(){renderNav();renderHeader();renderSummary();renderSpace();const [data,picks,brief,playbook]=await Promise.all(['data.json','picks.json','brief.json','playbook.json'].map(loadJson));S.data=data;S.picks=picks;S.brief=brief;S.playbook=playbook;S.personal=loadPersonal();renderHeader();renderSummary();renderSpace()}
init();
</script>
</body>
