<script>

const DATA_BASE = '../../';

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const safeUrl=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}};
const link=v=>`href="${esc(safeUrl(v)||'#')}" target="_blank" rel="noopener"`;
const readJson=(k,f)=>{try{return JSON.parse(localStorage.getItem('proto-'+k))??f}catch{return f}};
const saveJson=(k,v)=>{try{localStorage.setItem('proto-'+k,JSON.stringify(v))}catch{}};
const state={data:null,picks:null,brief:null,playbook:null,evolution:null,evolutionExpanded:false,edition:'',view:'today',salesFilter:'all',period:'day',metric:'minutes',trendDate:null,pickFilter:'all',methodFilter:'all',methodPicks:readJson('method-pick',{}),drawer:null,search:false,read:readJson('read-editions',{}),saved:new Set(readJson('saved',[])),later:new Map((readJson('later',[])||[]).filter(x=>x&&x.id).map(x=>[x.id,x]))};
const available=new Map();let toastTimer;
const loop={state:{picks:{},drafts:{}},outbox:readJson('method-outbox',{}),synced:null,connected:false,editing:new Set(),notes:{},expanded:new Set(),busy:new Set()};
let loopQueue=Promise.resolve();
function queueLoop(task){loopQueue=loopQueue.then(task).catch(()=>{loop.connected=false;refreshLoop()});return loopQueue}
async function loopRequest(path,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);try{const response=await fetch(LOOP_API+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,...(body===undefined?{}:{body:JSON.stringify(body)})});if(!response.ok)throw Error(response.status);const data=await response.json();if(!data||typeof data.picks!=='object'||!data.picks||typeof data.drafts!=='object'||!data.drafts)throw Error('Invalid state');return data}finally{clearTimeout(timer)}}
function canonicalMethodId(id){const m=methods().find(x=>methodKey(x)===id||x.title===id);return m?methodKey(m):id}
function applyLoop(data){loop.state=data;const next={};for(const [id,pick] of Object.entries(data.picks)){if(pick?.cat==='focus'||pick?.cat==='later')next[canonicalMethodId(id)]=pick.cat}for(const [id,pick] of Object.entries(loop.outbox)){if(pick.cat)next[id]=pick.cat;else delete next[id]}state.methodPicks=next;saveJson('method-pick',next);loop.connected=true;loop.synced=new Date();refreshLoop()}
function pickPayload(id,cat){const x=methods().find(x=>methodKey(x)===id||x.title===id);return {id:x?methodKey(x):id,title:x?.title||id,text:x?.text||'',cat}}
function rememberPick(payload){loop.outbox[payload.id]=payload;saveJson('method-outbox',loop.outbox)}

function submitFeedback(id,verdict){if(loop.busy.has(id))return;const note=loop.notes[id]??loop.state.drafts[id]?.note??'';if(verdict==='revise'&&!note.trim()){toast('请先写下修改意见');return}loop.busy.add(id);refreshLoop();return queueLoop(async()=>{try{const data=await loopRequest('/api/feedback',{id,verdict,note});loop.editing.delete(id);delete loop.notes[id];applyLoop(data);toast(({revise:'已记下，今晚会按意见重写',adopt:'已采纳，今晚归档生效',reject:'已放弃'})[verdict])}catch{loop.connected=false;toast('未连接联想，意见尚未提交，请稍后重试')}finally{loop.busy.delete(id);refreshLoop()}})}

function calendarRows(){return Array.from({length:30},(_,i)=>{const date=offsetDate(state.edition,i-29);return{date,row:daily(date)}})}
const aiTools=[['claude_code','Claude Code'],['codex','Codex CLI'],['kimi','Kimi Code'],['claude_desktop_code','Claude 桌面 Code'],['codex_desktop_code','Codex 桌面 Code'],['claude_desktop','Claude 桌面聊天'],['chatgpt_desktop','ChatGPT 桌面聊天'],['kimi_desktop','Kimi 桌面'],['claude','Claude 网页'],['chatgpt','ChatGPT 网页']];

function localTime(v,full=false){if(!v)return '未提供重置时间';const d=new Date(v);if(!Number.isFinite(+d))return '时间未知';const time=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});return full?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${time}`:`周${'日一二三四五六'[d.getDay()]} ${time}`}
function quotaPanel(){return `<div class="ai-panel"><h3>账户额度</h3><p class="ai-note">细线表示剩余额度；按最近观测值展示。</p>${[['claude','Claude'],['codex','Codex']].map(([key,name])=>`<div class="quota-row"><div class="quota-name">${name}</div>${[['five_hour','5 小时'],['seven_day','7 天']].map(([window,label])=>{const q=state.data?.quota?.[key]?.[window],v=q?.remaining_percent,stale=q?.observed_at&&Date.now()-new Date(q.observed_at).getTime()>6*3600000;return `<div><span class="ai-label">${label} 剩余</span><strong class="quota-value">${v==null?'—':esc(v)+'%'}</strong><div class="quota-track" role="img" aria-label="${name} ${label}剩余 ${v==null?'未知':esc(v)+'%'}"><i class="${v!=null&&Number(v)<20?'low':''}" style="width:${Math.max(0,Math.min(100,Number(v)||0))}%"></i></div><div class="quota-reset">${q?.resets_at?'重置 '+localTime(q.resets_at):'未提供重置时间'}${stale?`<span class="quota-stale">数据于 ${new Date(q.observed_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})} 观测，可能已变化</span>`:''}</div></div>`}).join('')}</div>`).join('')}</div>`}
function groupTotals(p){return `<div class="usage-groups">${aiGroups.map(([key,label,cls])=>`<div class="usage-group ${cls}"><span class="ai-label">${label}</span><strong>${p?.[key]?fmtMinutes(p[key].minutes):'—'}</strong><span class="token">${fmtToken(p?.[key]?.tokens)}</span> <span class="ai-label">Token</span></div>`).join('')}</div><div class="usage-grand"><span class="ai-label">去重总计</span><strong>${p?.total?fmtMinutes(p.total.minutes):'—'}</strong><strong>${fmtToken(p?.total?.tokens)} <small class="ai-label">Token</small></strong></div><p class="ai-note">总时长按活跃区间去重，可能小于各项相加。Token 仅合计有记录部分，不含缓存读取。</p>`}
function sortedTools(p){return aiTools.map(([key,name])=>({key,name,...p?.[key]})).sort((a,b)=>(Number(b.minutes)||0)-(Number(a.minutes)||0))}
function toolClass(key){return ['claude_code','codex','kimi'].includes(key)?'cli':key.includes('desktop')?'desktop':'web'}
function toolTable(p){const rows=sortedTools(p),active=rows.filter(x=>Number(x.minutes)||Number(x.tokens)||Number(x.cache_read_tokens)),zero=rows.filter(x=>!Number(x.minutes)&&!Number(x.tokens)&&!Number(x.cache_read_tokens));const row=x=>`<tr><td><i class="tool-dot ${toolClass(x.key)}" aria-hidden="true"></i>${esc(x.name)}<span class="cache-inline">缓存读取 ${fmtToken(x.cache_read_tokens)}</span></td><td>${x.minutes==null?'—':fmtMinutes(x.minutes)}</td><td>${fmtToken(x.tokens)}</td><td class="cache-col">${fmtToken(x.cache_read_tokens)}</td></tr>`;return `<table class="ai-table"><thead><tr><th scope="col">工具</th><th scope="col">时长</th><th scope="col">Token</th><th scope="col" class="cache-col">缓存读取</th></tr></thead><tbody>${active.map(row).join('')}</tbody></table>${p&&zero.length?`<details class="zero-tools"><summary>其余 ${zero.length} 项无使用</summary>${zero.map(x=>`<p><i class="tool-dot ${toolClass(x.key)}" aria-hidden="true"></i>${esc(x.name)} · ${fmtMinutes(x.minutes)} · Token ${fmtToken(x.tokens)} · 缓存读取 ${fmtToken(x.cache_read_tokens)}</p>`).join('')}</details>`:''}${!p?'<p class="ai-note">本区间暂无数据。</p>':''}<p class="ai-note">桌面聊天无官方 token 数据；“—”表示未记录，0 表示记录为零。</p>`}
function weekBaseline(){const from=state.data?.periods?.week?.from, end=state.data?.periods?.day?.from||state.data?.daily?.at(-1)?.date;if(!from||!end||end<from)return null;const days=Math.round((new Date(end+'T00:00:00Z')-new Date(from+'T00:00:00Z'))/86400000)+1;const total=state.data?.periods?.week?.total;return total?{minutes:Number(total.minutes)/days,tokens:Number(total.tokens)/days,days,from,end}:null}
function comparison(n,avg){return avg>0?`${n>=avg?'高':'低'} ${Math.abs((Number(n)/avg-1)*100).toFixed(1)}%`:Number(n)>0?'有使用（日均为 0）':'持平'}
function usageReport(full=false){const date=offsetDate(state.edition,-1),prev=daily(date),base=weekBaseline(),top=sortedTools(prev).filter(x=>Number(x.minutes)||Number(x.tokens)||Number(x.cache_read_tokens)).slice(0,3);return `<div class="ai-label">昨日 / ${esc(date)}</div>${prev?`<div class="ai-figures"><div><span class="ai-label">合计时长</span><strong class="ai-figure">${fmtMinutes(prev.total?.minutes)}</strong></div><div><span class="ai-label">Token · 不含缓存</span><strong class="ai-figure">${fmtToken(prev.total?.tokens)}</strong></div></div>${base?`<p class="ai-change">较本周日均：时长${comparison(prev.total?.minutes,base.minutes)}；Token ${comparison(prev.total?.tokens,base.tokens)}。</p><p class="ai-note">本周日均 ${fmtMinutes(base.minutes)} / ${fmtToken(base.tokens)} Token，按 ${base.from} 至 ${base.end} 的 ${base.days} 个自然日计算。</p>`:''}<div class="ai-label">使用最多的工具 / 按时长</div><ol class="ai-top-tools">${top.map((x,i)=>`<li><strong>${i+1}. ${esc(x.name)}</strong><span>${fmtMinutes(x.minutes)}</span><small>Token ${fmtToken(x.tokens)}${full?' · 缓存读取 '+fmtToken(x.cache_read_tokens):''}</small></li>`).join('')||'<li>昨日无使用</li>'}</ol>${top.some(x=>x.tokens==null)?'<p class="ai-note">Token “—”表示无记录；桌面聊天无官方 token 数据。</p>':''}${full?groupTotals(prev)+toolTable(prev):''}`:'<p class="usage-lede">昨天没有使用记录。</p>'}${quotaPanel()}${full?dataFooter():''}<button class="text-btn" data-view="ai" data-section="usage">查看完整趋势 →</button>`}
function trendSelection(){const date=state.trendDate||state.edition,row=daily(date);return `<h4>${esc(date)}${row?'':' · 无记录'}</h4><div class="trend-detail-grid">${aiGroups.map(([key,label])=>`<div><span class="ai-label">${label}</span><strong>${row?fmtMinutes(row[key]?.minutes):'—'}</strong><span class="ai-note">${fmtToken(row?.[key]?.tokens)} Token</span></div>`).join('')}</div><p class="ai-note">${row?'当天去重总计 '+fmtMinutes(row.total?.minutes)+' · '+fmtToken(row.total?.tokens)+' Token':'无记录日期留空，不作为零值参与均线。'}</p>`}
function trendPanel(){const rows=calendarRows(),metric=state.metric||'minutes',amount=row=>aiGroups.reduce((sum,[key])=>sum+(Number(row?.[key]?.[metric])||0),0),max=Math.max(1,...rows.map(x=>amount(x.row))),valid=rows.slice(-7).filter(x=>x.row),mean=valid.length?valid.reduce((sum,x)=>sum+amount(x.row),0)/valid.length:0,format=metric==='tokens'?fmtToken:fmtMinutes;return `<section class="ai-panel"><h3>近 30 天</h3><div class="filter-row" role="group" aria-label="趋势指标">${[['minutes','时长'],['tokens','Token']].map(([key,label])=>`<button class="filter-btn ${metric===key?'active':''}" data-metric="${key}" aria-pressed="${metric===key}">${label}</button>`).join('')}</div><div class="ai-legend"><span><i></i>终端 CLI</span><span><i class="desktop"></i>桌面</span><span><i class="web"></i>网页</span><span><i class="mean"></i>7 日均线</span></div><p class="ai-note">上限 ${format(max)}${metric==='tokens'?' Token':''} · 近 7 日日均 ${format(mean)}${metric==='tokens'?' Token':''}</p><div class="trend-plot"><div class="trend-bars">${rows.map(({date,row})=>`<button class="trend-day" data-trend-date="${date}" aria-pressed="${date===(state.trendDate||state.edition)}" aria-label="${date}：${row?format(amount(row)):'无记录'}" title="${date}：${row?format(amount(row)):'无记录'}">${[...aiGroups].reverse().map(([key,label,cls])=>`<span class="trend-segment ${cls}" style="height:${(Number(row?.[key]?.[metric])||0)/max*100}%"></span>`).join('')}</button>`).join('')}</div><div class="trend-mean" style="bottom:${mean/max*100}%"></div></div><div class="chart-axis"><span>${rows[0].date.slice(5)}</span><span>${rows[14].date.slice(5)}</span><span>${rows[29].date.slice(5)}</span></div><p class="ai-note">悬停、点选或用键盘聚焦某日查看明细。7 日均线为末 7 个自然日中有记录日期的分组堆叠值平均；时长堆叠未跨组去重，桌面 Token 仅含有记录部分。</p><div class="trend-details" id="trend-details" aria-live="polite">${trendSelection()}</div></section>`}
function dataFooter(){return `<div class="ai-data-footer"><p class="ai-note">数据更新时间：${state.data?.updated_at?localTime(state.data.updated_at,true)+'（本地时间）':'未知'}</p><p class="ai-note">${esc(state.data?.note||'暂无数据说明')}</p></div>`}
function codexHistory(){
const daily=state.data?.codex_api?.token_usage?.daily;
if(!Array.isArray(daily))return '';
const rows=daily.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.tokens!=null&&Number.isFinite(Number(x.tokens))&&Number(x.tokens)>=0).sort((a,b)=>a.date.localeCompare(b.date));
if(!rows.length)return '';
const monthly=new Map(),first=rows[0].date,last=rows.at(-1).date;
let total=0,peak=rows[0];
for(const row of rows){const month=row.date.slice(0,7),tokens=Number(row.tokens);monthly.set(month,(monthly.get(month)||0)+tokens);total+=tokens;if(tokens>Number(peak.tokens))peak=row}
const months=[];
for(let month=first.slice(0,7);month<=last.slice(0,7);){months.push({month,tokens:monthly.get(month)||0});const [year,m]=month.split('-').map(Number);month=m===12?`${year+1}-01`:`${year}-${String(m+1).padStart(2,'0')}`}
const max=Math.max(1,...months.map(x=>x.tokens)),tokenLabel=n=>n>=1e8?`${(n/1e8).toFixed(1)} 亿 token`:`${(n/1e4).toFixed(1)} 万 token`,label=x=>`${x.month} · ${tokenLabel(x.tokens)}`;
return `<section class="ai-panel"><h3>Codex 账户历史</h3><div class="codex-months" style="--months:${months.length}" role="group" aria-label="Codex 月度 token 用量">${months.map((x,i)=>`<button class="codex-month" data-codex-month="${esc(label(x))}" aria-label="${esc(label(x))}" title="${esc(label(x))}" aria-pressed="${i===months.length-1}"><span class="codex-month-track"><span class="codex-month-bar" style="height:${x.tokens/max*100}%"></span></span><span class="codex-month-label">${Number(x.month.slice(5))}月</span></button>`).join('')}</div><p class="codex-month-detail" id="codex-month-detail" aria-live="polite">${label(months.at(-1))}</p><p class="ai-note">${first} 至 ${last} · 累计 ${tokenLabel(total)} · 最高一天 ${tokenLabel(Number(peak.tokens))}（${peak.date}）</p></section>`
}
function renderMine(){const p=state.data?.periods?.[state.period],usage=state.data?.codex_api?.token_usage;return `${quotaPanel()}<section class="ai-panel"><h3>区间用量</h3><div class="period-row ai-periods" role="group" aria-label="用量区间">${[['day','日'],['week','周'],['month','月'],['year','年']].map(([key,label])=>`<button class="filter-btn ${state.period===key?'active':''}" data-period="${key}" aria-pressed="${state.period===key}">${label}</button>`).join('')}</div><p class="ai-note">${p?.from?esc(p.from)+' 起 · 截至 '+esc(state.data?.periods?.day?.from||state.edition):'本区间暂无数据'}</p>${groupTotals(p)}</section><section class="ai-panel"><h3>分工具明细</h3>${toolTable(p)}</section>${trendPanel()}<section class="ai-panel"><h3>Codex 账户累计</h3><div class="account-grid"><div><span class="ai-label">累计 Token</span><strong>${fmtToken(usage?.lifetime_tokens)}</strong></div><div><span class="ai-label">单日峰值 Token</span><strong>${fmtToken(usage?.peak_daily_tokens)}</strong></div><div><span class="ai-label">连续使用</span><strong>${usage?.current_streak_days??'—'} <small>天</small></strong><small>最长 ${usage?.longest_streak_days??'—'} 天</small></div><div><span class="ai-label">最长一轮</span><strong>${usage?.longest_running_turn_seconds==null?'—':fmtMinutes(usage.longest_running_turn_seconds/60)}</strong></div></div><p class="ai-note">账户累计与区间会话记录口径不同，不直接相加。</p></section>${codexHistory()}<p class="ai-note">Codex 官方按账户统计，含所有设备；Claude 等其他工具的本机记录从 2026-09-02 开始。</p>${dataFooter()}`}

function methodKey(x){return String(x.id??x.title)}
function methodChoice(x){return state.methodPicks[methodKey(x)]??state.methodPicks[x.title]}
function methodButtons(x,i){return [['focus','重点用'],['later','后面可以用'],...(methodChoice(x)?[['cancel','取消']]:[])].map(([key,label])=>`<button class="text-btn method-pick" data-method-pick="${key}" data-index="${i}" aria-pressed="${methodChoice(x)===key}">${label}</button>`).join('')}
function migrateMethodPicks(){let changed=false;for(const m of methods()){const legacy=['method:'+methodKey(m),'method:'+m.title,methodKey(m),m.title];const later=[...state.later.values()].filter(x=>legacy.includes(x.id)||x.kind==='方法'&&x.title===m.title);if(later.length||legacy.some(k=>state.saved.has(k))){if(!methodChoice(m))state.methodPicks[methodKey(m)]='later';later.forEach(x=>state.later.delete(x.id));legacy.forEach(k=>state.saved.delete(k));changed=true}}if(changed){saveJson('method-pick',state.methodPicks);saveJson('later',[...state.later.values()]);saveJson('saved',[...state.saved])}}
function toggleMethodPick(i,pick){const x=methods()[Number(i)];if(!x)return;const previous=methodChoice(x),cat=pick==='cancel'||previous===pick?null:pick;delete state.methodPicks[x.title];delete state.methodPicks[methodKey(x)];if(cat)state.methodPicks[methodKey(x)]=cat;saveJson('method-pick',state.methodPicks);rememberPick(pickPayload(methodKey(x),cat));refreshLoop();return queueLoop(flushPicks)}
function renderMethods(){const all=methods(),shown=all.filter(x=>state.methodFilter==='all'||methodChoice(x)===state.methodFilter);return `${renderDrafts()}<div class="filter-row method-segments" aria-label="方法分类">${[['all','全部'],['focus','重点用'],['later','后面可以用']].map(([key,label])=>`<button class="filter-btn ${state.methodFilter===key?'active':''}" data-method-filter="${key}" aria-pressed="${state.methodFilter===key}">${label} ${key==='all'?all.length:all.filter(x=>methodChoice(x)===key).length}</button>`).join('')}</div><p class="loop-status" role="status">${esc(syncLabel())}</p><div class="section-head"><h2>方法库</h2><small>${shown.length} 条</small></div>${shown.map(x=>`<article class="method-row"><div class="meta-line">${esc(x.category)} · ${esc(x.kind==='checklist'?'清单':'方法')} · ${esc(dateOnly(x.created_at))}${draftStatus(x)?` · ${draftStatus(x)}`:''}</div><h3><button data-detail="method" data-index="${all.indexOf(x)}">${esc(you(x.title))}</button></h3><p class="excerpt">${esc(you(x.text))}</p><div class="row-actions"><button class="text-btn" data-detail="method" data-index="${all.indexOf(x)}">查看全文 →</button><button class="text-btn" data-copy="${all.indexOf(x)}">复制方法</button>${methodButtons(x,all.indexOf(x))}</div></article>`).join('')||'<div class="empty">暂无方法</div>'}`}

function evolutionItems(){return (Array.isArray(state.evolution?.items)?state.evolution.items:[]).filter(x=>x&&['skill','rule','idea'].includes(x.kind)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function evolutionRow(x){return `<article class="evolution-row"><div class="meta-line">${esc(x.date)} · ${({skill:'新 skill',rule:'规则升级',idea:'可执行想法'})[x.kind]}</div><h3>${safeUrl(x.url)?`<a ${link(x.url)}>${esc(x.title)} ↗</a>`:esc(x.title)}</h3><p>${esc(x.desc)}</p>${x.action?`<p class="evolution-action">${esc(x.action)}</p>`:''}<small class="evolution-status">${esc(x.status)}</small></article>`}
function renderEvolution(){const all=evolutionItems(),end=dateOnly(new Date()),start=offsetDate(end,-6),recent=all.filter(x=>String(x.date).slice(0,10)>=start&&String(x.date).slice(0,10)<=end);return `<div class="section-head"><h2>进化</h2></div><p class="space-note">近 7 天新增 ${recent.filter(x=>x.kind==='skill').length} 个 skill，升级 ${recent.filter(x=>x.kind==='rule').length} 条规则</p><p class="ai-note">更新于 ${esc(state.evolution?.updated_at||'未知')}</p>${(state.evolutionExpanded?all:all.slice(0,8)).map(evolutionRow).join('')}${all.length>8?`<button class="text-btn" data-evolution-toggle aria-expanded="${state.evolutionExpanded}">${state.evolutionExpanded?'收起':'展开全部 '+all.length+' 条'}</button>`:''}`}
function compactUsage(){const date=offsetDate(state.edition,-1),p=daily(date),top=sortedTools(p).filter(x=>Number(x.minutes)||Number(x.tokens)||Number(x.cache_read_tokens)).slice(0,3);return `<p class="compact-total">${esc(date)} · ${p?`合计 ${fmtMinutes(p.total?.minutes)} · ${fmtToken(p.total?.tokens)} Token`:'暂无使用记录'}</p>${top.length?`<p class="compact-tools">${top.map(x=>`${esc(x.name)} ${fmtMinutes(x.minutes)}`).join(' · ')}</p>`:''}<p class="compact-quota">${[['claude','Claude'],['codex','Codex']].map(([key,name])=>`${name} 5h 余 ${esc(state.data?.quota?.[key]?.five_hour?.remaining_percent??'—')}%`).join(' · ')}</p><button class="text-btn" data-view="ai" data-section="usage">查看完整用量 →</button>`}

function renderAI(){return `<nav class="ai-anchors" aria-label="AI 小节">${visibleAISections().map(([id,label])=>`<a href="#ai-${id}" data-ai-anchor="${id}">${label}</a>`).join('')}</nav>${visibleAISections().map(([id,label,render])=>`<section class="ai-section" id="ai-${id}" aria-label="${label}">${id==='usage'?'<div class="section-head"><h2>用量</h2></div>':''}<div id="ai-${id}-content">${render()}</div></section>`).join('')}`}
function renderAISection(id){const target=$('#ai-'+id+'-content'),render=aiSections.find(x=>x[0]===id)?.[2];if(target&&render){target.innerHTML=render();syncSaved();updateScroll()}}
function setView(v,section){const legacy={mine:'usage',explore:'picks',methods:'methods'};if(legacy[v]){section=legacy[v];v='ai'}const changed=state.view!==v;state.view=v;$('.layout').classList.toggle('single',v!=='today');$('#space-view').classList.toggle('mine',v==='ai');$$('#view-nav [data-view]').forEach(x=>{x.classList.toggle('active',x.dataset.view===v);x.setAttribute('aria-current',x.dataset.view===v?'page':'false')});$('#today-view').hidden=v!=='today';$('#space-view').hidden=v==='today';if(v!=='today'){const ai=v==='ai';$('#space-title').textContent=ai?'AI':'销售';$('#space-lede').textContent=ai?'看用量、试工具，把方法变成每天的进化。':'销售情报，对销售意味着什么';if(changed||!section)$('#space-content').innerHTML=ai?renderAI():renderSales();syncSaved()}if(v==='ai'&&section){requestAnimationFrame(()=>{const target=$('#ai-'+section);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});updateScroll()})}else window.scrollTo({top:0,behavior:'instant'});updateScroll()}
function block(t,v){return v?`<div class="drawer-block"><h4>${esc(t)}</h4><p>${esc(you(v))}</p></div>`:''}
function drawerAction(type,index){return `<button data-detail="${type}" data-index="${index}">查看详情 →</button>`}
function renderDrawer(){const ref=state.drawer;if(!ref)return;let title='',kicker='内容详情',html='';const {type,index}=ref;if(type==='later'){title='稍后读';kicker='阅读清单';html=[...state.later.values()].map(x=>`<div class="drawer-block"><h4>${esc(x.kind)}</h4><h3>${safeUrl(x.url)?`<a ${link(x.url)}>${esc(you(x.title))} ↗</a>`:esc(you(x.title))}</h3>${x.text?`<p>${esc(you(x.text))}</p>`:''}<div class="drawer-actions"><button data-remove="${esc(x.id)}">移出稍后读</button></div></div>`).join('')||'<div class="empty">这里还是空的。遇到想细读的内容，点一下「稍后」。</div>'}
else if(type==='brief'){const x=briefItems()[index];if(!x)return;title='简报详情';html=`<div class="meta-line">${esc(salesTag(x))} · ${esc(x.source)} · ${esc(state.edition)}</div><h3>${esc(you(x.title))}</h3>${block('摘要',x.summary)}${block('对销售的意义',x.why)}<div class="drawer-actions"><button data-favorite="brief:${esc(x.title)}">${state.saved.has('brief:'+x.title)?'已收藏':'收藏'}</button>${safeUrl(x.url)?`<a ${link(x.url)}>查看来源 ↗</a>`:''}</div>`}
else if(type==='pick'){const x=picks()[index];if(!x)return;title='工具详情';html=`<div class="meta-line">适合度 ${esc(x.ai?.fit)}/5 · ★ ${fmtNum(x.stars)} · 日增 ${fmtNum(x.growth?.per_day)}</div><h3>${esc(x.name)}</h3>${block('是什么',x.ai?.what||x.ai?.zh||x.desc)}${block('为什么值得看',x.ai?.why)}${block('怎么开始',x.ai?.setup)}${block('使用方式',x.ai?.how)}${block('许可提醒',x.quality?.license_note)}<div class="drawer-actions"><button data-favorite="pick:${esc(x.name)}">${state.saved.has('pick:'+x.name)?'已收藏':'收藏'}</button>${register({id:'pick:'+x.name,kind:'开源项目',title:x.name,url:x.url})}${safeUrl(x.url)?`<a ${link(x.url)}>打开项目 ↗</a>`:''}</div>`}
else if(type==='method'){const x=methods()[index];if(!x)return;title='方法详情';html=`<div class="meta-line">${esc(x.category)} · ${esc(dateOnly(x.created_at))}${draftStatus(x)?' · '+draftStatus(x):''}</div><h3>${esc(you(x.title))}</h3>${block('方法内容',x.text)}<div class="drawer-actions"><button data-copy="${index}">复制方法</button>${methodButtons(x,index)}</div>`}
else if(type==='usage'){title='AI 用量';html=usageReport(true)}
else if(type==='competitors'){title='竞品动态';html=briefItems().filter(x=>x.tag==='竞品').map(x=>`<div class="drawer-block"><h4>${esc(x.source)}</h4><h3>${esc(x.title)}</h3>${block('对销售',x.why)}<div class="drawer-actions">${drawerAction('brief',briefItems().indexOf(x))}</div></div>`).join('')||'<div class="empty">暂无数据</div>'}
else if(type==='weekmethods'){title='本周方法';html=weekMethods().map(x=>`<div class="drawer-block"><h4>${esc(x.category)}</h4><h3>${esc(x.title)}</h3><div class="drawer-actions">${drawerAction('method',methods().findIndex(m=>m.id===x.id))}</div></div>`).join('')||'<div class="empty">暂无数据</div>';html+='<div class="drawer-actions"><button data-view="ai" data-section="methods">打开方法库 →</button></div>'}
$('#drawer-title').textContent=title;$('#drawer-kicker').textContent=kicker;$('#drawer-body').innerHTML=html;if(type!=='later')syncSaved()}
function closeOverlays(){state.drawer=null;state.search=false;$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#search-box').classList.remove('open');$('#backdrop').classList.remove('open');document.body.classList.remove('locked')}
function openDrawer(type,index=0){closeOverlays();state.drawer={type,index:Number(index)};renderDrawer();$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#backdrop').classList.add('open');document.body.classList.add('locked');$('#drawer-close').focus()}
function searchSources(){return [...briefItems().map((x,i)=>({type:'brief',index:i,title:x.title,sub:'简报 · '+x.tag})),...picks().map((x,i)=>({type:'pick',index:i,title:x.name,sub:'工具 · '+you(x.ai?.zh||'')})),...methods().map((x,i)=>({type:'method',index:i,title:x.title,sub:'方法 · '+x.category}))]}
function renderSearch(){const q=$('#search-input').value.trim().toLocaleLowerCase();const found=(q?searchSources().filter(x=>(x.title+' '+x.sub).toLocaleLowerCase().includes(q)):searchSources()).slice(0,q?12:7);$('#search-results').innerHTML=`<div class="mini-label">${q?found.length+' 个结果':'快速打开'}</div>${found.map(x=>`<button class="search-row" data-detail="${x.type}" data-index="${x.index}"><strong>${esc(you(x.title))}</strong><span>${esc(x.sub)}</span></button>`).join('')||'<div class="empty">暂无结果</div>'}`}
function openSearch(){closeOverlays();state.search=true;$('#search-input').value='';renderSearch();$('#search-box').classList.add('open');$('#backdrop').classList.add('open');document.body.classList.add('locked');$('#search-input').focus()}
async function copyMethod(i){const x=methods()[Number(i)];if(!x)return;try{await navigator.clipboard.writeText(`${you(x.title)}\n\n${you(x.text)}`);toast('已复制方法')}catch{toast('复制失败，请在详情中手动复制')}}
function toggleFavorite(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);saveJson('saved',[...state.saved]);if(state.view==='ai')renderAISection('picks');if(state.drawer)renderDrawer();toast(state.saved.has(id)?'已收藏':'已取消收藏')}
function updateScroll(){const ai=state.view==='ai';if(!ai)return;const ids=ai?visibleAISections().map(([id])=>'ai-'+id):['summary','s1','s2','s3'];let active='#'+ids[0];for(const id of ids){const x=document.getElementById(id);if(x&&!x.hidden&&x.getBoundingClientRect().top<=innerHeight*.28)active='#'+id}if(ai&&innerHeight+scrollY>=document.documentElement.scrollHeight-2)active='#'+ids.at(-1);$$('.ai-anchors a').forEach(x=>{const on=x.getAttribute('href')===active;x.classList.toggle('active',on);if(on)x.setAttribute('aria-current','location');else x.removeAttribute('aria-current')})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-sales-filter],[data-evolution-toggle],[data-ai-anchor],[data-view],[data-detail],[data-save],[data-remove],[data-favorite],[data-copy],[data-period],[data-metric],[data-trend-date],[data-pick-filter],[data-method-filter],[data-method-pick],[data-feedback],[data-revise]');if(!t)return;if(t.dataset.salesFilter){state.salesFilter=t.dataset.salesFilter;$('#space-content').innerHTML=renderSales();syncSaved()}else if(t.hasAttribute('data-evolution-toggle')){state.evolutionExpanded=!state.evolutionExpanded;renderAISection('evolution')}else if(t.dataset.aiAnchor){e.preventDefault();$('#ai-'+t.dataset.aiAnchor)?.scrollIntoView({behavior:'smooth',block:'start'})}else if(t.dataset.feedback){submitFeedback(t.dataset.draftId,t.dataset.feedback)}else if(t.dataset.revise){loop.editing.add(t.dataset.revise);refreshLoop()}else if(t.dataset.view){closeOverlays();setView(t.dataset.view,t.dataset.section)}else if(t.dataset.detail)openDrawer(t.dataset.detail,t.dataset.index);else if(t.dataset.save)saveButton(t.dataset.save);else if(t.dataset.remove){state.later.delete(t.dataset.remove);saveJson('later',[...state.later.values()]);syncSaved();toast('已移出稍后读')}else if(t.dataset.favorite)toggleFavorite(t.dataset.favorite);else if(t.dataset.copy!==undefined)copyMethod(t.dataset.copy);else if(t.dataset.period){state.period=t.dataset.period;renderAISection('usage')}else if(t.dataset.metric){state.metric=t.dataset.metric;renderAISection('usage')}else if(t.dataset.trendDate){selectTrend(t.dataset.trendDate)}else if(t.dataset.pickFilter){state.pickFilter=t.dataset.pickFilter;renderAISection('picks');syncSaved()}else if(t.dataset.methodPick){toggleMethodPick(t.dataset.index,t.dataset.methodPick)}else if(t.dataset.methodFilter){state.methodFilter=t.dataset.methodFilter;renderAISection('methods')}});
document.addEventListener('input',e=>{if(e.target.matches('[data-draft-note]'))loop.notes[e.target.dataset.draftNote]=e.target.value});
document.addEventListener('toggle',e=>{if(e.target.matches('[data-draft-details]')){const id=e.target.dataset.draftDetails;e.target.open?loop.expanded.add(id):loop.expanded.delete(id)}},true);
function selectCodexMonth(t){const detail=$('#codex-month-detail');if(detail)detail.textContent=t.dataset.codexMonth;$$('[data-codex-month]').forEach(x=>x.setAttribute('aria-pressed',String(x===t)))}
for(const event of ['click','pointerover','focusin'])document.addEventListener(event,e=>{const t=e.target.closest('[data-codex-month]');if(t)selectCodexMonth(t)});
function selectTrend(date){if(state.trendDate===date)return;state.trendDate=date;const detail=$('#trend-details');if(detail)detail.innerHTML=trendSelection();$$('[data-trend-date]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.trendDate===date)))}
for(const event of ['pointerover','focusin'])document.addEventListener(event,e=>{const t=e.target.closest('[data-trend-date]');if(t)selectTrend(t.dataset.trendDate)});
$('#later-tab').addEventListener('click',()=>openDrawer('later'));$('#search-trigger').addEventListener('click',openSearch);$('#search-close').addEventListener('click',closeOverlays);$('#drawer-close').addEventListener('click',closeOverlays);$('#backdrop').addEventListener('click',closeOverlays);$('#search-input').addEventListener('input',renderSearch);document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.search?closeOverlays():openSearch()}if(e.key==='Escape')closeOverlays()});let touchY=0;$('#drawer').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});$('#drawer').addEventListener('touchend',e=>{if(innerWidth<=560&&e.changedTouches[0].clientY-touchY>110&&$('#drawer-body').scrollTop===0)closeOverlays()},{passive:true});window.addEventListener('scroll',updateScroll,{passive:true});
const finishObserver=new IntersectionObserver(entries=>{if(entries.some(x=>x.isIntersecting)&&state.view==='today'&&!state.read[state.edition]){state.read[state.edition]=true;saveJson('read-editions',state.read);updateReadState()}},{threshold:.35});finishObserver.observe($('#finish'));
async function getFile(name){try{const r=await fetch(DATA_BASE+name,{cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}catch{return null}}
async function init(){const [data,picksFile,brief,playbook,evolution]=await Promise.all(['data.json','picks.json','brief.json','playbook.json','evolution.json'].map(getFile));state.data=data;state.picks=picksFile;state.brief=brief;state.playbook=playbook;state.evolution=evolution;migrateMethodPicks();setEdition();renderToday();setView('today');updateScroll();queueLoop(initLoop)}init();
})();
</script>
</body></html>
