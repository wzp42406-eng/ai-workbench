  <script>
    const DATA_BASE = '../../';
    const GROUPS = [
      ['inbox','全部待处理','◫'],['competition','竞品','◇'],['industry','行业','◉'],['github','AI 工具','✦'],['news','AI 资讯','◈'],['past','往期项目','◷'],
      ['methods','方法库','▤'],['later','稍后','◷'],['saved','已收藏','☆'],['archive','已归档','▧']
    ];
    const $ = s => document.querySelector(s);
    const clean = value => String(value ?? '').replaceAll('Peter','你');
    const esc = value => clean(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeUrl = value => { try { const u = new URL(value); return ['https:','http:'].includes(u.protocol) ? u.href : ''; } catch { return ''; } };
    const formatNum = n => Number(n || 0).toLocaleString('zh-CN');
    const compact = n => n >= 10000 ? (n/10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/,'') + ' 万' : formatNum(n);
    const formatTime = value => { if (!value) return '时间未知'; const d = new Date(value); return Number.isNaN(+d) ? String(value).slice(5,10) : new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',timeZone:'Asia/Shanghai'}).format(d); };
    const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const beijingDate = value => { if(!value)return '';const d=new Date(value);return Number.isNaN(+d)?'':new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d); };
    const loadLocal = (key,fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
    let state = loadLocal('proto-intel-state',{}), derivedMethods = loadLocal('proto-derived-methods',[]);
    let all = [], group = 'inbox', selected = null, mobileOpen = false, usage = null, usagePeriod = 'day', missing = {brief:false,picks:false,playbook:false,news:true}, pickedBatchDate = '';
    let history = [], commandResults = [], commandIndex = 0, toastTimer;
    const saveState = () => localStorage.setItem('proto-intel-state',JSON.stringify(state));
    const status = item => state[item.id] || '';
    const isMethod = item => item.type === 'method';
    const isDone = item => ['follow','method','later','archive'].includes(status(item));
    const currentList = () => all.filter(item => {
      const st = status(item);
      if(group === 'inbox') return item.daily && !st;
      if(group === 'past') return item.type === 'github' && !item.daily;
      if(group === 'later') return st === 'later';
      if(group === 'saved') return st === 'follow' || st === 'method';
      if(group === 'archive') return st === 'archive';
      if(group === 'methods') return isMethod(item);
      return item.type === group && item.daily && !st;
    }).sort((a,b) => (b.time || '').localeCompare(a.time || ''));
    const labelFor = item => item.type === 'competition' ? '竞品' : item.type === 'industry' ? '行业' : item.type === 'github' ? 'AI 工具' : item.type === 'news' ? 'AI 资讯' : '方法';
    const sourceFor = item => item.source || (item.type === 'github' ? 'GitHub' : item.type === 'method' ? (item.category || '方法库') : '来源未知');
    const titleFor = key => GROUPS.find(x => x[0] === key)?.[1] || '全部待处理';
    function makeItems(brief,picks,playbook,personal,news) {
      const items=[];
      for(const [i,x] of (brief?.items || []).entries()) items.push({id:'brief:'+i+':'+(brief.date||''),type:x.tag==='竞品'?'competition':'industry',daily:true,title:x.title,summary:x.summary,why:x.why,url:x.url,source:x.source,time:brief.date,tag:x.tag});
      for(const x of (picks?.items || [])) if(Number(x.ai?.fit)!==1) items.push({id:'github:'+x.name,type:'github',daily:beijingDate(x.picked)===pickedBatchDate,title:x.ai?.zh || x.name,summary:x.ai?.what || x.desc,why:x.ai?.why,url:x.url,source:x.name,time:x.picked,tag:x.track==='work'?'工作相关':'GitHub 精选',extra:x});
      const methodItems=[...(playbook?.items || []),...(personal?.items || []),...derivedMethods];
      for(const [i,x] of methodItems.entries()) items.push({id:'method:'+(x.id || 'local-'+i),type:'method',title:x.title || '未命名方法',summary:x.text || '',why:'',url:'',source:x.category || (i < (playbook?.items||[]).length ? '每周整理' : '我的方法'),time:x.created_at,tag:x.kind || '方法',category:x.category});
      for(const [i,x] of (news?.items || []).entries()) {const time=x.published_at || x.created_at || x.date || '';items.push({id:'news:'+(x.id || x.url || i),type:'news',daily:beijingDate(time)===today,title:x.title || x.name || 'AI 资讯',summary:x.summary || x.description || x.desc || '',why:x.why || '',url:x.url || x.link,source:x.source || 'AI 资讯',time,tag:'AI 资讯'});}
      return items;
    }
    function renderNav(){
      const counts={inbox:all.filter(x=>x.daily&&!status(x)).length,competition:currentCount('competition'),industry:currentCount('industry'),github:currentCount('github'),news:currentCount('news'),past:all.filter(x=>x.type==='github'&&!x.daily).length,methods:all.filter(isMethod).length,later:all.filter(x=>status(x)==='later').length,saved:all.filter(x=>['follow','method'].includes(status(x))).length,archive:all.filter(x=>status(x)==='archive').length};
      const make = slice => slice.filter(([id])=>id!=='news'||!missing.news).map(([id,label,icon])=>`<button data-group="${id}" class="${group===id?'active':''}"><span class="icon">${icon}</span><span>${label}</span><span class="count">${counts[id]}</span></button>`).join('');
      $('#nav-main').innerHTML=make(GROUPS.slice(0,7)); $('#nav-personal').innerHTML=make(GROUPS.slice(7));
      $('#mobile-tabs').innerHTML=GROUPS.filter(([id])=>id!=='news'||!missing.news).map(([id,label])=>`<button data-group="${id}" class="${group===id?'active':''}">${label}<span> ${counts[id]}</span></button>`).join('');
      document.querySelectorAll('[data-group]').forEach(btn=>btn.onclick=()=>setGroup(btn.dataset.group));
    }
    function currentCount(type){return all.filter(x=>x.type===type && x.daily && !status(x)).length;}
    function renderProgress(){
      const todays=all.filter(x=>x.daily);
      const done=todays.filter(isDone).length;
      $('#progress-text').textContent=`${done} / ${todays.length} 已处理`;
      $('#progress-fill').style.width=(todays.length ? done/todays.length*100 : 0)+'%';
    }
    function renderList(){
      const list=currentList(), el=$('#list');
      $('#queue-title').textContent=titleFor(group);
      $('#queue-sub').textContent=group==='inbox'?'把有价值的信息留下，其余清空。':group==='past'?'浏览往期 GitHub 项目，收藏或存入方法。':group==='methods'?'可复制、可复用的工作方法。':group==='later'?'留到更合适的时候再处理。':group==='saved'?'已经挑出的重要线索。':group==='archive'?'处理完的情报留在这里。':'聚焦这一类线索。';
      $('#toolbar-label').textContent=group==='inbox'?'待决定':group==='methods'?'全部方法':'条目';
      $('#toolbar-count').textContent=`${list.length} 条`;
      const batchLabel=pickedBatchDate && pickedBatchDate!==today && (group==='inbox'||group==='github') ? `最新一批：${Number(pickedBatchDate.slice(5,7))}/${pickedBatchDate.slice(8,10)}` : '';
      if(!list.length){
        const fileMissing=(group==='competition'||group==='industry')&&missing.brief || (group==='github'||group==='past')&&missing.picks || group==='news'&&missing.news || group==='methods'&&missing.playbook;
        const noData=fileMissing || (group==='inbox' && !all.some(x=>x.daily));
        el.innerHTML=noData?'<div class="empty"><h3>暂无数据</h3><p>当前来源还没有可读取的内容。</p></div>':`<div class="empty"><div class="empty-orbit"><svg viewBox="0 0 40 40"><path d="m10 21 7 7 14-16"/></svg></div><h3>${group==='inbox'?'收件箱清零':'这里暂时清空了'}</h3><p>${group==='inbox'?'今天的线索已分拣完。做得漂亮。':'切换其他分组，继续查看情报。'}</p>${group==='inbox'?'<button id="view-saved">查看已收藏</button>':''}</div>`;
        $('#view-saved')?.addEventListener('click',()=>setGroup('saved'));
      } else {
        el.innerHTML=(batchLabel?`<div class="group-label">${batchLabel}</div>`:'')+list.map(item=>`<button class="row ${selected===item.id?'selected':''} ${isDone(item)?'processed':''}" data-id="${esc(item.id)}"><span class="row-top"><span class="dot ${item.type}"></span><span class="row-type">${esc(labelFor(item))}</span><span class="row-time">${esc(formatTime(item.time))}</span></span><div class="row-title">${esc(item.title)}</div><div class="row-meta"><span>${esc(sourceFor(item))}</span><span class="sep">·</span><span>${esc(item.tag || '精选')}</span>${status(item)?`<span class="row-status">${esc(statusLabel(status(item)))}</span>`:''}</div></button>`).join('');
        el.querySelectorAll('.row').forEach(row=>{
          row.onclick=()=>select(row.dataset.id,true);
          let startX=0,startY=0;
          row.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});
          row.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>65 && Math.abs(dy)<45 && !isMethod(all.find(x=>x.id===row.dataset.id))){e.preventDefault();e.stopPropagation();act(dx<0?'archive':'later',row.dataset.id);}}, {passive:false});
        });
      }
    }
    function statusLabel(st){return ({follow:'值得跟进',method:'已存方法',later:'稍后',archive:'已归档'})[st]||'';}
    function setGroup(next){group=next;mobileOpen=false;$('#detail').classList.remove('mobile-open');const list=currentList();selected=list[0]?.id||null;render();}
    function select(id,open){selected=id;if(open){mobileOpen=true;$('#detail').classList.add('mobile-open');}renderList();renderDetail();document.querySelector('.row.selected')?.scrollIntoView({block:'nearest'});}
    function renderDetail(){
      const item=all.find(x=>x.id===selected), content=$('#detail-scroll'), actions=$('#detail-actions');
      $('#breadcrumb-group').textContent=titleFor(group);$('#breadcrumb-title').textContent=item?.title||'选择一条情报';
      if(!item){actions.classList.remove('method-actions');content.innerHTML='<div class="detail-placeholder"><div><svg viewBox="0 0 50 50"><path d="M25 4 45 25 25 46 5 25Z"/><path d="M25 14v22M14 25h22"/></svg><h3>从队列里选一条情报</h3><p>每条信息，只做一个小决定。</p></div></div>';actions.innerHTML='';return;}
      const extra=item.extra, github=item.type==='github';
      const suggest=item.type==='competition'?'提取一个可用于客户对话的问题，并核对原文出处。':item.type==='industry'?'找一个相关客户场景，验证它是否影响当前商机。':item.type==='github'?'先看项目说明与许可证，再决定是否试用。':item.type==='method'?'复制方法，在下一次相关任务中试用。':'核对原文，判断是否值得和客户讨论。';
      const sections=[];
      if(item.why) sections.push(section('对销售 / 对你',item.why,'↗'));
      if(github && extra.ai?.how) sections.push(section('如何上手',extra.ai.how,'⌘'));
      if(github && extra.quality?.license_note) sections.push(section('许可提示',extra.quality.license_note,'!'));
      if(item.type==='method') sections.push(section('方法内容',item.summary,'▤'));
      const info=[`来源 <b>${esc(sourceFor(item))}</b>`,`时间 <b>${esc(formatTime(item.time))}</b>`];
      if(github){info.push(`匹配 <b>${Number(extra.ai?.fit)||'—'} / 5</b>`);info.push(`星标 <b>${compact(extra.stars)} 颗</b>`);if(extra.growth?.per_day)info.push(`增长 <b>+${compact(extra.growth.per_day)} 颗/天</b>`);}
      content.innerHTML=`<div class="detail-content"><div class="tag-line"><span class="dot ${item.type}"></span><span class="tag-chip">${esc(labelFor(item))}</span><span>${esc(item.tag||'情报')}</span></div><h2 class="detail-title">${esc(item.title)}</h2>${item.type==='method'?'':`<p class="detail-lede">${esc(item.summary||'暂无摘要')}</p>`}<div class="info-strip">${info.map(x=>`<span>${x}</span>`).join('')}</div>${sections.join('')}${item.type==='method'?'':`<div class="suggestion"><div class="section-label">下一步建议</div><p>${esc(suggest)}</p></div>`}${safeUrl(item.url)?`<a class="source-link" href="${esc(safeUrl(item.url))}" target="_blank" rel="noopener">打开原文 ↗</a>`:''}</div>`;
      actions.classList.toggle('method-actions',item.type==='method');actions.innerHTML=item.type==='method'?`<button class="action primary" data-action="copy">复制方法 <span class="key">S</span></button><button class="action" data-action="archive">归档 <span class="key">E</span></button>`:`<button class="action primary" data-action="follow">值得跟进 <span class="key">F</span></button><button class="action" data-action="method">存入方法 <span class="key">S</span></button><button class="action" data-action="later">稍后 <span class="key">L</span></button><button class="action" data-action="archive">归档 <span class="key">E</span></button><button class="action" data-action="open">打开原文 <span class="key">O</span></button>`;
      actions.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=()=>act(btn.dataset.action));
    }
    function section(title,body,icon){return `<div class="detail-section"><div class="section-label"><span class="mini-icon">${icon}</span>${title}</div><div class="section-copy">${esc(body)}</div></div>`;}
    function render(){renderNav();renderProgress();renderList();renderDetail();}
    function nextAfter(id){const list=currentList();const index=list.findIndex(x=>x.id===id);return list[index+1]?.id || list[index-1]?.id || null;}
    function act(action,id=selected){const item=all.find(x=>x.id===id);if(!item)return;
      if(action==='open'){if(safeUrl(item.url))window.open(safeUrl(item.url),'_blank','noopener');else toast('暂无原文链接');return;}
      if(action==='copy'){copyMethod(item);return;}
      const old=status(item), next=nextAfter(id), prevMethods=derivedMethods.slice();
      if(action==='method'){
        if(!derivedMethods.some(x=>x.id==='saved-'+item.id))derivedMethods.push({id:'saved-'+item.id,kind:'note',category:'情报摘录',title:item.title,text:[item.summary,item.why].filter(Boolean).join('\n\n'),created_at:new Date().toISOString()});
        localStorage.setItem('proto-derived-methods',JSON.stringify(derivedMethods));
      }
      history.push({id,old,group,prevMethods});if(history.length>30)history.shift();
      state[id]=action;saveState();toast(({follow:'已标记跟进',method:'已存入方法',later:'已放入稍后',archive:'已归档'})[action]+' · Z 撤销');
      if(action==='method')all=all.filter(x=>!x.id.startsWith('method:saved-')).concat(derivedMethods.map(x=>({id:'method:'+x.id,type:'method',title:x.title,summary:x.text,source:x.category,time:x.created_at,tag:'情报摘录',category:x.category})));
      selected=next;mobileOpen=false;$('#detail').classList.remove('mobile-open');render();
    }
    function undo(){const prev=history.pop();if(!prev){toast('没有可撤销的操作');return;}if(prev.old)state[prev.id]=prev.old;else delete state[prev.id];saveState();derivedMethods=prev.prevMethods;localStorage.setItem('proto-derived-methods',JSON.stringify(derivedMethods));all=all.filter(x=>!x.id.startsWith('method:saved-')).concat(derivedMethods.map(x=>({id:'method:'+x.id,type:'method',title:x.title,summary:x.text,source:x.category,time:x.created_at,tag:'情报摘录',category:x.category})));group=prev.group;selected=prev.id;render();toast('已撤销');}
    async function copyMethod(item){try{await navigator.clipboard.writeText(clean(item.summary));toast('方法已复制');}catch{toast('复制失败，请手动选择文字');}}
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);}
    function move(delta){const list=currentList();if(!list.length)return;const idx=list.findIndex(x=>x.id===selected);select(list[Math.max(0,Math.min(list.length-1,idx+delta))].id,false);}
    function modalOpen(which){$('#veil').classList.add('open');$('#command').classList.toggle('open',which==='command');$('#shortcuts').classList.toggle('open',which==='shortcuts');if(which==='command'){$('#command-input').value='';renderResults();$('#command-input').focus();}}
    function modalClose(){ $('#veil').classList.remove('open');$('#command').classList.remove('open');$('#shortcuts').classList.remove('open');$('#drawer').classList.remove('open');}
    function renderResults(){const query=$('#command-input').value.trim().toLowerCase();const commands=query?[]:[{id:'cmd:usage',title:'打开我的 AI 状态',type:'command',source:'命令'},{id:'cmd:inbox',title:'返回全部待处理',type:'command',source:'命令'}];commandResults=commands.concat(all.filter(x=>[x.title,x.summary,x.source,x.tag].some(v=>clean(v).toLowerCase().includes(query))).slice(0,30));commandIndex=Math.min(commandIndex,Math.max(0,commandResults.length-1));$('#results').innerHTML=commandResults.length?commandResults.map((x,i)=>`<button class="result ${i===commandIndex?'active':''}" data-result="${i}"><span class="dot ${x.type}"></span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}<small>${esc(sourceFor(x))}</small></span><span class="result-kind">${x.type==='method'?'复制方法':x.type==='command'?'执行':'打开详情'}</span></button>`).join(''):'<div class="empty-note" style="padding:20px;color:#888;font-size:11px">没有匹配的条目</div>';$('#results').querySelectorAll('.result').forEach(btn=>{btn.onmouseenter=()=>{commandIndex=Number(btn.dataset.result);$('#results').querySelectorAll('.result').forEach((e,i)=>e.classList.toggle('active',i===commandIndex));};btn.onclick=executeResult;});}
    function executeResult(){const item=commandResults[commandIndex];if(!item)return;modalClose();if(item.id==='cmd:usage'){openUsage();return;}if(item.id==='cmd:inbox'){setGroup('inbox');return;}if(isMethod(item)){copyMethod(item);return;}group=item.type;selected=item.id;render();mobileOpen=true;$('#detail').classList.add('mobile-open');}
    function openUsage(){$('#veil').classList.add('open');$('#drawer').classList.add('open');renderUsage();}
    function renderUsage(){const body=$('#usage-body');if(!usage){body.innerHTML='<div class="empty-note">暂无数据</div>';return;}const p=usage.periods?.[usagePeriod];if(!p){body.innerHTML='<div class="empty-note">暂无数据</div>';return;}const total=p.total||{},cli=p.cli_total||{},desktop=p.desktop_total||{};const periodLabels={day:'今日',week:'本周',month:'本月',year:'今年',all:'累计'};const validDays=(usage.daily||[]).filter(x=>x?.date).slice(-14);const max=Math.max(1,...validDays.map(x=>Number(x.total?.minutes)||0));body.innerHTML=`<div class="periods">${Object.entries(periodLabels).map(([id,name])=>`<button data-period="${id}" class="${usagePeriod===id?'active':''}">${name}</button>`).join('')}</div><div class="usage-card"><small>${periodLabels[usagePeriod]} · 已记录的 AI 使用</small><div class="usage-big">${Math.round(Number(total.minutes)||0)} <em>分钟</em></div><small>合计 ${compact(Number(total.tokens)||0)} token</small><div class="usage-split"><div><small>命令行</small><b>${Math.round(Number(cli.minutes)||0)} 分钟</b></div><div><small>桌面端</small><b>${Math.round(Number(desktop.minutes)||0)} 分钟</b></div></div></div><div class="chart-title">最近 ${validDays.length} 个有记录的日期</div>${validDays.length?`<div class="chart">${validDays.map(x=>`<div class="bar ${x.date===today?'today':''}" style="height:${Math.max(3,(Number(x.total?.minutes)||0)/max*100)}%" title="${esc(x.date)} · ${Math.round(Number(x.total?.minutes)||0)} 分钟"></div>`).join('')}</div><div class="chart-labels"><span>${esc(validDays[0].date.slice(5))}</span><span>${esc(validDays.at(-1).date.slice(5))}</span></div>`:'<div class="empty-note">暂无数据</div>'}<div class="usage-note">仅显示数据文件中出现的日期；缺失日期不计为 0。部分桌面对话没有 token 记录，合计以数据源口径为准。</div>`;body.querySelectorAll('[data-period]').forEach(btn=>btn.onclick=()=>{usagePeriod=btn.dataset.period;renderUsage();});}
    function bind(){ $('#search-open').onclick=$('#details-search').onclick=()=>modalOpen('command');$('#details-help').onclick=()=>modalOpen('shortcuts');$('#command-close').onclick=modalClose;$('#veil').onclick=modalClose;$('#usage-open').onclick=$('#mobile-usage-open').onclick=openUsage;$('#usage-close').onclick=modalClose;$('#mobile-back').onclick=()=>{$('#detail').classList.remove('mobile-open');mobileOpen=false;};$('#command-input').oninput=()=>{commandIndex=0;renderResults();};$('#command-input').onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();commandIndex=Math.max(0,Math.min(commandResults.length-1,commandIndex+(e.key==='ArrowDown'?1:-1)));renderResults();}if(e.key==='Enter'){e.preventDefault();executeResult();}};
      const shortcuts=[['向下 / 向上','J / K'],['打开详情','Enter'],['值得跟进','F'],['存入方法 / 复制','S'],['稍后','L'],['归档','E'],['打开原文','O'],['撤销','Z'],['命令搜索','⌘ / Ctrl + K'],['快捷键','?']];$('#shortcut-grid').innerHTML=shortcuts.map(([name,key])=>`<div><span>${name}</span><span class="key">${key}</span></div>`).join('');
      document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modalOpen('command');return;}if(e.key==='Escape'){modalClose();if(mobileOpen){$('#detail').classList.remove('mobile-open');mobileOpen=false;}return;}if($('#command').classList.contains('open')||$('#shortcuts').classList.contains('open')||$('#drawer').classList.contains('open')||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='?'){e.preventDefault();modalOpen('shortcuts');return;}if(e.key==='j'||e.key==='J'){e.preventDefault();move(1);}else if(e.key==='k'||e.key==='K'){e.preventDefault();move(-1);}else if(e.key==='Enter'){if(selected){e.preventDefault();mobileOpen=true;$('#detail').classList.add('mobile-open');renderDetail();}}else if(e.key==='z'||e.key==='Z'){undo();}else if('fFsSlLeEoO'.includes(e.key)){const map={f:'follow',s:isMethod(all.find(x=>x.id===selected))?'copy':'method',l:'later',e:'archive',o:'open'};act(map[e.key.toLowerCase()]);}});
    }
    async function getJson(file){try{const r=await fetch(DATA_BASE+file,{cache:'no-store'});if(!r.ok)throw new Error();return await r.json();}catch{return null;}}
    async function getNews(){try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),3500);const r=await fetch('https://aihot.news/api/v1',{signal:ctrl.signal});clearTimeout(timer);if(!r.ok)throw new Error();const data=await r.json();const items=Array.isArray(data)?data:Array.isArray(data.items)?data.items:Array.isArray(data.data)?data.data:[];return {items};}catch{return null;}}
    async function init(){bind();render();const [brief,picks,playbook,data]=await Promise.all([getJson('brief.json'),getJson('picks.json'),getJson('playbook.json'),getJson('data.json')]);let personal=loadLocal('wb-playbook',{items:[]});if(!personal||!Array.isArray(personal.items))personal={items:[]};usage=data;missing={brief:!brief,picks:!picks,playbook:!playbook && !personal.items.length && !derivedMethods.length,news:true};const dates=[...new Set((picks?.items||[]).filter(x=>Number(x.ai?.fit)!==1).map(x=>beijingDate(x.picked)).filter(date=>date && date<=today))].sort();pickedBatchDate=dates.includes(today)?today:(dates.at(-1)||'');all=makeItems(brief,picks,playbook,personal,null);selected=currentList()[0]?.id||null;render();getNews().then(news=>{if(!news?.items?.length)return;missing.news=false;all=all.concat(makeItems(null,null,null,{items:[]},news).filter(x=>x.type==='news'&&x.daily));render();});}
    init();
  </script>
