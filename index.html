function story(x,i){const id='brief:'+x.title;const save=register({id,kind:x.tag||'情报',title:x.title,url:x.url});return `<article class="story feature"><div class="story-kicker">${String(i+1).padStart(2,'0')} / ${esc(x.tag||'AI 情报')}</div><div class="story-head"><h3><a ${link(x.url)}>${esc(you(x.title))}</a></h3>${save}</div>${x.summary?`<p>${esc(you(x.summary))}</p>`:''}<div class="sales"><b>怎么用</b>${esc(you(x.why||'暂无说明'))}</div><div class="source">来源 · <a ${link(x.url)}>${esc(x.source||'查看来源')} ↗</a>　<button class="text-btn" data-detail="brief" data-index="${i}">详情 →</button></div></article>`}
function weeklyEvolution(){const all=evolutionItems(),today=state.edition||dateOnly(new Date()),d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+6)%7);const monday=d.toISOString().slice(0,10);return all.find(x=>String(x.date).slice(0,10)>=monday&&String(x.date).slice(0,10)<=today)||all[0]||null}
function renderToday(){renderDailyQuote();const p=rolling7(),items=todayBriefs(),top=picks()[0],evo=weeklyEvolution(),q=state.data?.quota,last=Array.from({length:7},(_,i)=>daily(offsetDate(state.edition,i-6))),max=Math.max(1,...last.map(x=>Number(x?.total?.minutes)||0));$('#judgement').textContent=`今天有 ${items.length} 条 AI 情报值得看，近 7 天 AI 用了 ${fmtMinutes(p.total?.minutes)}。`;$('#intro-note').textContent=`${state.edition} 版 · 先看重点，再挑一件今天能试的事。`;$('#summary-grid').innerHTML=`<button class="summary-cell" data-section="usage"><span class="summary-label">近 7 天用量</span><span class="summary-value">${fmtMinutes(p.total?.minutes)}</span><span class="summary-desc">${fmtToken(p.total?.tokens)} Token</span><span class="mini-bars" aria-hidden="true">${last.map(x=>`<i style="height:${Math.max(2,Math.round(Number(x?.total?.minutes||0)/max*27))}px"></i>`).join('')}</span><span class="summary-foot">查看用量 →</span></button><button class="summary-cell" data-section="usage"><span class="summary-label">7 天额度</span><span class="summary-value">Claude ${esc(q?.claude?.seven_day?.remaining_percent??'—')}%</span><span class="summary-desc">Codex ${esc(q?.codex?.seven_day?.remaining_percent??'—')}% · 剩余</span><span class="summary-foot">查看额度 →</span></button><button class="summary-cell" data-section="picks"><span class="summary-label">值得试</span><span class="summary-value">${esc(top?.name||'暂无数据')}</span><span class="summary-desc">${esc(you(top?.ai?.zh||top?.desc||'暂无精选工具'))}</span><span class="summary-foot">查看工具 →</span></button><button class="summary-cell" data-section="evolution"><span class="summary-label">本周进化</span><span class="summary-value">${esc(evo?.title||'暂无记录')}</span><span class="summary-desc">${esc(evo?.date||'')}</span><span class="summary-foot">查看记录 →</span></button>`;$('#top-stories').innerHTML=items.map((x,i)=>story(x,i)).join('')||'<div class="empty">暂无数据</div>';renderAISection('picks');renderAISection('usage');renderAISection('accounts');renderAISection('evolution');syncSaved()}
function renderExplore(){const all=picks(),shown=all.filter(x=>state.pickFilter==='all'||x.track==='work');return `<div class="filter-row explore-segments">${[['all','全部'],['work','工作相关']].map(([k,v])=>`<button class="filter-btn ${state.pickFilter===k?'active':''}" data-pick-filter="${k}">${v}</button>`).join('')}</div><div class="section-head"><h2>值得试的工具</h2><small>${shown.length} 个</small></div>${shown.map((x,i)=>`<article class="space-row"><div class="meta-line">${x.track==='work'?'工作相关 · ':''}适合度 ${esc(x.ai?.fit)}/5 · ★ ${fmtNum(x.stars)}</div><div class="row-head"><h3><button data-detail="pick" data-index="${all.indexOf(x)}">${esc(x.name)}</button></h3>${register({id:'pick:'+x.name,kind:'工具',title:x.name,url:x.url})}</div><p>${esc(you(x.ai?.zh||x.desc))}</p><div class="row-actions"><button class="text-btn" data-detail="pick" data-index="${all.indexOf(x)}">查看详情 →</button><button class="text-btn" data-favorite="pick:${esc(x.name)}">${state.saved.has('pick:'+x.name)?'已收藏':'收藏'}</button></div></article>`).join('')||'<div class="empty">暂无数据</div>'}`}
function calendarRows(){return Array.from({length:30},(_,i)=>{const date=offsetDate(state.edition,i-29);return{date,row:daily(date)}})}
const aiTools=[['claude_code','Claude Code'],['codex','Codex CLI'],['kimi','Kimi Code'],['claude_desktop_code','Claude 桌面 Code'],['codex_desktop_code','Codex 桌面 Code'],['claude_desktop','Claude 桌面聊天'],['chatgpt_desktop','ChatGPT 桌面聊天'],['kimi_desktop','Kimi 桌面'],['claude','Claude 网页'],['chatgpt','ChatGPT 网页']];
const aiGroups=[['cli_total','终端','cli'],['desktop_total','桌面','desktop'],['web_total','网页','web']];
function localTime(v,full=false){if(!v)return '未提供重置时间';const d=new Date(v);if(!Number.isFinite(+d))return '时间未知';const time=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});return full?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${time}`:`周${'日一二三四五六'[d.getDay()]} ${time}`}
function quotaPanel(){return `<div class="ai-panel"><h3>账户额度</h3><p class="ai-note">细线表示剩余额度；按最近观测值展示。</p>${[['claude','Claude'],['codex','Codex']].map(([key,name])=>`<div class="quota-row"><div class="quota-name">${name}</div>${[['seven_day','7 天']].map(([window,label])=>{const q=state.data?.quota?.[key]?.[window],v=q?.remaining_percent,stale=q?.observed_at&&Date.now()-new Date(q.observed_at).getTime()>6*3600000;return `<div><span class="ai-label">${label} 剩余</span><strong class="quota-value">${v==null?'—':esc(v)+'%'}</strong><div class="quota-track" role="img" aria-label="${name} ${label}剩余 ${v==null?'未知':esc(v)+'%'}"><i class="${v!=null&&Number(v)<20?'low':''}" style="width:${Math.max(0,Math.min(100,Number(v)||0))}%"></i></div><div class="quota-reset">${q?.resets_at?'重置 '+localTime(q.resets_at):'未提供重置时间'}${stale?`<span class="quota-stale">数据于 ${new Date(q.observed_at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})} 观测，可能已变化</span>`:''}</div></div>`}).join('')}</div>`).join('')}</div>`}
function groupTotals(p){return `<div class="usage-groups">${aiGroups.map(([key,label,cls])=>`<div class="usage-group ${cls}"><span class="ai-label">${label}</span><strong>${p?.[key]?fmtMinutes(p[key].minutes):'—'}</strong><span class="token">${fmtToken(p?.[key]?.tokens)}</span> <span class="ai-label">Token</span></div>`).join('')}</div><div class="usage-grand"><span class="ai-label">去重总计</span><strong>${p?.total?fmtMinutes(p.total.minutes):'—'}</strong><strong>${fmtToken(p?.total?.tokens)} <small class="ai-label">Token</small></strong></div><p class="ai-note">总时长按活跃区间去重，可能小于各项相加。Token 仅合计有记录部分，不含缓存读取。</p>`}
function trendSelection(){const date=state.trendDate||state.edition,row=daily(date);return `<h4>${esc(date)}${row?'':' · 无记录'}</h4><div class="trend-detail-grid">${aiGroups.map(([key,label])=>`<div><span class="ai-label">${label}</span><strong>${row?fmtMinutes(row[key]?.minutes):'—'}</strong><span class="ai-note">${fmtToken(row?.[key]?.tokens)} Token</span></div>`).join('')}</div><p class="ai-note">${row?'当天去重总计 '+fmtMinutes(row.total?.minutes)+' · '+fmtToken(row.total?.tokens)+' Token':'无记录日期留空，不作为零值参与均线。'}</p>`}
function trendPanel(){const rows=calendarRows(),metric=state.metric||'minutes',amount=row=>aiGroups.reduce((sum,[key])=>sum+(Number(row?.[key]?.[metric])||0),0),max=Math.max(1,...rows.map(x=>amount(x.row))),valid=rows.slice(-7).filter(x=>x.row),mean=valid.length?valid.reduce((sum,x)=>sum+amount(x.row),0)/valid.length:0,format=metric==='tokens'?fmtToken:fmtMinutes;return `<section class="ai-panel"><h3>近 30 天趋势</h3><div class="filter-row" role="group" aria-label="趋势指标">${[['minutes','时长'],['tokens','Token']].map(([key,label])=>`<button class="filter-btn ${metric===key?'active':''}" data-metric="${key}" aria-pressed="${metric===key}">${label}</button>`).join('')}</div><div class="ai-legend"><span><i></i>终端</span><span><i class="desktop"></i>桌面</span><span><i class="web"></i>网页</span><span><i class="mean"></i>7 日均线</span></div><p class="ai-note">上限 ${format(max)}${metric==='tokens'?' Token':''} · 近 7 日日均 ${format(mean)}${metric==='tokens'?' Token':''}</p><div class="trend-plot"><div class="trend-bars">${rows.map(({date,row})=>`<button class="trend-day" data-trend-date="${date}" aria-pressed="${date===(state.trendDate||state.edition)}" aria-label="${date}：${row?format(amount(row)):'无记录'}" title="${date}：${row?format(amount(row)):'无记录'}">${[...aiGroups].reverse().map(([key,label,cls])=>`<span class="trend-segment ${cls}" style="height:${(Number(row?.[key]?.[metric])||0)/max*100}%"></span>`).join('')}</button>`).join('')}</div><div class="trend-mean" style="bottom:${mean/max*100}%"></div></div><div class="chart-axis"><span>${rows[0].date.slice(5)}</span><span>${rows[14].date.slice(5)}</span><span>${rows[29].date.slice(5)}</span></div><p class="ai-note">悬停、点选或用键盘聚焦某日查看明细。7 日均线为末 7 个自然日中有记录日期的分组堆叠值平均；时长堆叠未跨组去重，桌面 Token 仅含有记录部分。</p><div class="trend-details" id="trend-details" aria-live="polite">${trendSelection()}</div></section>`}
function dataFooter(){return `<div class="ai-data-footer"><p class="ai-note">数据更新时间：${state.data?.updated_at?localTime(state.data.updated_at,true)+'（本地时间）':'未知'}</p><p class="ai-note">${esc(state.data?.note||'暂无数据说明')}</p></div>`}
function rolling7(){const end=state.edition||dateOnly(new Date()),start=offsetDate(end,-6),days=(state.data?.daily||[]).filter(x=>String(x.date)>=start&&String(x.date)<=end);const add=(a,b)=>{if(b==null)return a;if(typeof b==='number')return(typeof a==='number'?a:0)+b;if(typeof b==='object'){const o=a&&typeof a==='object'?a:{};for(const k in b)o[k]=add(o[k],b[k]);return o}return a??b};let r={};for(const d of days){const{date,...rest}=d;r=add(r,rest)}r.from=start;return r}
function renderUsage(){const p=state.period==='week'?rolling7():state.data?.periods?.[state.period];return `${quotaPanel()}<section class="ai-panel"><h3>区间用量</h3><div class="period-row ai-periods" role="group" aria-label="用量区间">${[['week','近 7 天'],['month','月'],['year','年']].map(([key,label])=>`<button class="filter-btn ${state.period===key?'active':''}" data-period="${key}" aria-pressed="${state.period===key}">${label}</button>`).join('')}</div><p class="ai-note">${p?.from?esc(p.from)+' 起 · 截至 '+esc(state.data?.periods?.day?.from||state.edition):'本区间暂无数据'}</p>${groupTotals(p)}</section>${trendPanel()}${dataFooter()}`}
function renderAccounts(){const rows=state.data?.daily||[],keys=['claude_code','claude_desktop_code','claude'],sum=key=>rows.reduce((total,row)=>total+keys.reduce((n,k)=>n+(Number(row?.[k]?.[key])||0),0),0),from=rows.map(x=>x.date).filter(Boolean).sort()[0],usage=state.data?.codex_api?.token_usage;return `<section class="ai-panel"><h2>账户累计</h2><div class="account-grid"><div><h3>Claude</h3><span class="ai-label">累计时长</span><strong>${from?fmtMinutes(sum('minutes')):'—'}</strong><span class="ai-label">累计 Token</span><strong>${from?fmtToken(sum('tokens')):'—'}</strong><small>自 ${esc(from||'暂无记录')} 起 · Code、桌面 Code、网页</small></div><div><h3>Codex</h3><span class="ai-label">累计 Token</span><strong>${fmtToken(usage?.lifetime_tokens)}</strong><small>单日峰值 ${fmtToken(usage?.peak_daily_tokens)} Token</small><small>连续使用 ${usage?.current_streak_days??'—'} 天 · 最长 ${usage?.longest_streak_days??'—'} 天</small><small>最长一轮 ${usage?.longest_running_turn_seconds==null?'—':fmtMinutes(usage.longest_running_turn_seconds/60)}</small></div></div><p class="ai-note">Claude 来自全部历史日记录；Codex 来自账户累计，两者口径不同。</p></section>`}
function evolutionItems(){return (Array.isArray(state.evolution?.items)?state.evolution.items:[]).filter(x=>x&&['skill','rule','idea'].includes(x.kind)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))}
function evolutionRow(x){return `<article class="evolution-row"><div class="meta-line">${esc(x.date)} · ${({skill:'新技能',rule:'规则升级',idea:'可执行想法'})[x.kind]}</div><h3>${safeUrl(x.url)?`<a ${link(x.url)}>${esc(x.title)} ↗</a>`:esc(x.title)}</h3><p>${esc(x.desc)}</p>${x.action?`<p class="evolution-action">${esc(x.action)}</p>`:''}<small class="evolution-status">${esc(x.status)}</small></article>`}
function renderEvolution(){const x=weeklyEvolution();return `<div class="section-head"><h2>本周进化</h2></div>${x?evolutionRow(x):'<div class="empty">暂无进化记录</div>'}`}
const aiSections=[['picks',renderExplore],['usage',renderUsage],['accounts',renderAccounts],['evolution',renderEvolution]];
function renderAISection(id){const target=$('#ai-'+id+'-content'),render=aiSections.find(x=>x[0]===id)?.[1];if(target)target.innerHTML=render()}
function scrollToAI(id){document.getElementById('ai-'+id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function block(t,v){return v?`<div class="drawer-block"><h4>${esc(t)}</h4><p>${esc(you(v))}</p></div>`:''}
function drawerAction(type,index){return `<button data-detail="${type}" data-index="${index}">查看详情 →</button>`}
function renderDrawer(){const ref=state.drawer;if(!ref)return;let title='',kicker='细读',html='';const {type,index}=ref;if(type==='later'){title='稍后读';kicker='稍后读';html=[...state.later.values()].map(x=>`<div class="drawer-block"><h4>${esc(x.kind)}</h4><h3>${safeUrl(x.url)?`<a ${link(x.url)}>${esc(you(x.title))} ↗</a>`:esc(you(x.title))}</h3>${x.text?`<p>${esc(you(x.text))}</p>`:''}<div class="drawer-actions"><button data-remove="${esc(x.id)}">移出稍后读</button></div></div>`).join('')||'<div class="empty">这里还是空的。遇到想细读的内容，点一下「稍后」。</div>'}
else if(type==='brief'){const x=briefItems()[index];if(!x)return;title='简报详情';html=`<div class="meta-line">${esc(x.tag||'AI 情报')} · ${esc(x.source)} · ${esc(state.edition)}</div><h3>${esc(you(x.title))}</h3>${block('摘要',x.summary)}${block('怎么用',x.why)}<div class="drawer-actions"><button data-favorite="brief:${esc(x.title)}">${state.saved.has('brief:'+x.title)?'已收藏':'收藏'}</button>${safeUrl(x.url)?`<a ${link(x.url)}>查看来源 ↗</a>`:''}</div>`}
else if(type==='pick'){const x=picks()[index];if(!x)return;title='工具详情';html=`<div class="meta-line">适合度 ${esc(x.ai?.fit)}/5 · ★ ${fmtNum(x.stars)} · 日增 ${fmtNum(x.growth?.per_day)}</div><h3>${esc(x.name)}</h3>${block('是什么',x.ai?.what||x.ai?.zh||x.desc)}${block('为什么值得看',x.ai?.why)}${block('怎么开始',x.ai?.setup)}${block('使用方式',x.ai?.how)}${block('许可提醒',x.quality?.license_note)}<div class="drawer-actions"><button data-favorite="pick:${esc(x.name)}">${state.saved.has('pick:'+x.name)?'已收藏':'收藏'}</button>${register({id:'pick:'+x.name,kind:'工具',title:x.name,url:x.url})}${safeUrl(x.url)?`<a ${link(x.url)}>打开项目 ↗</a>`:''}</div>`}
$('#drawer-title').textContent=title;$('#drawer-kicker').textContent=kicker;$('#drawer-body').innerHTML=html;if(type!=='later')syncSaved()}
function closeOverlays(){state.drawer=null;state.search=false;$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#search-box').classList.remove('open');$('#backdrop').classList.remove('open');document.body.classList.remove('locked')}
function openDrawer(type,index=0){closeOverlays();state.drawer={type,index:Number(index)};renderDrawer();$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#backdrop').classList.add('open');document.body.classList.add('locked');$('#drawer-close').focus()}
function searchSources(){return [...todayBriefs().map((x,i)=>({type:'brief',index:i,title:x.title,sub:'AI 情报 · '+(x.tag||'')})).filter(x=>!['渠道活动','销售技巧','商业洞察','竞品'].some(tag=>x.sub.endsWith(tag))),...picks().map((x,i)=>({type:'pick',index:i,title:x.name,sub:'工具 · '+you(x.ai?.zh||'')}))]}
function renderSearch(){const q=$('#search-input').value.trim().toLocaleLowerCase();const found=(q?searchSources().filter(x=>(x.title+' '+x.sub).toLocaleLowerCase().includes(q)):searchSources()).slice(0,q?12:7);$('#search-results').innerHTML=`<div class="mini-label">${q?found.length+' 个结果':'快速打开'}</div>${found.map(x=>`<button class="search-row" data-detail="${x.type}" data-index="${x.index}"><strong>${esc(you(x.title))}</strong><span>${esc(x.sub)}</span></button>`).join('')||'<div class="empty">暂无结果</div>'}`}
function openSearch(){closeOverlays();state.search=true;$('#search-input').value='';renderSearch();$('#search-box').classList.add('open');$('#backdrop').classList.add('open');document.body.classList.add('locked');$('#search-input').focus()}
function toggleFavorite(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);saveJson('saved',[...state.saved]);renderAISection('picks');if(state.drawer)renderDrawer();toast(state.saved.has(id)?'已收藏':'已取消收藏')}
function updateScroll(){const ids=['summary','s1','s3'];let active='#summary';for(const id of ids){const x=document.getElementById(id);if(x&&x.getBoundingClientRect().top<=innerHeight*.28)active='#'+id}$$('.toc a,.mobile-toc a').forEach(x=>{const on=x.getAttribute('href')===active;x.classList.toggle('active',on);if(on)x.setAttribute('aria-current','location');else x.removeAttribute('aria-current')})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-section],[data-detail],[data-save],[data-remove],[data-favorite],[data-period],[data-metric],[data-trend-date],[data-pick-filter]');if(!t)return;if(t.dataset.section){closeOverlays();scrollToAI(t.dataset.section)}else if(t.dataset.detail)openDrawer(t.dataset.detail,t.dataset.index);else if(t.dataset.save)saveButton(t.dataset.save);else if(t.dataset.remove){state.later.delete(t.dataset.remove);saveJson('later',[...state.later.values()]);syncSaved();toast('已移出稍后读')}else if(t.dataset.favorite)toggleFavorite(t.dataset.favorite);else if(t.dataset.period){state.period=t.dataset.period;renderAISection('usage')}else if(t.dataset.metric){state.metric=t.dataset.metric;renderAISection('usage')}else if(t.dataset.trendDate){selectTrend(t.dataset.trendDate)}else if(t.dataset.pickFilter){state.pickFilter=t.dataset.pickFilter;renderAISection('picks');syncSaved()}});
function selectTrend(date){if(state.trendDate===date)return;state.trendDate=date;const detail=$('#trend-details');if(detail)detail.innerHTML=trendSelection();$$('[data-trend-date]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.trendDate===date)))}
for(const event of ['pointerover','focusin'])document.addEventListener(event,e=>{const t=e.target.closest('[data-trend-date]');if(t)selectTrend(t.dataset.trendDate)});
$('#later-tab').addEventListener('click',()=>openDrawer('later'));$('#search-trigger').addEventListener('click',openSearch);$('#search-close').addEventListener('click',closeOverlays);$('#drawer-close').addEventListener('click',closeOverlays);$('#backdrop').addEventListener('click',closeOverlays);$('#search-input').addEventListener('input',renderSearch);document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.search?closeOverlays():openSearch()}if(e.key==='Escape')closeOverlays()});let touchY=0;$('#drawer').addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});$('#drawer').addEventListener('touchend',e=>{if(innerWidth<=560&&e.changedTouches[0].clientY-touchY>110&&$('#drawer-body').scrollTop===0)closeOverlays()},{passive:true});window.addEventListener('scroll',updateScroll,{passive:true});
const finishObserver=new IntersectionObserver(entries=>{if(entries.some(x=>x.isIntersecting)&&!state.read[state.edition]){state.read[state.edition]=true;saveJson('read-editions',state.read);updateReadState()}},{threshold:.35});finishObserver.observe($('#finish'));
async function getFile(name){try{const r=await fetch(DATA_BASE+name,{cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}catch{return null}}
async function init(){const [data,picksFile,brief,evolution]=await Promise.all(['data.json','picks.json','brief.json','evolution.json'].map(getFile));state.data=data;state.picks=picksFile;state.brief=brief;state.evolution=evolution;setEdition();renderToday();updateScroll()}init();
})();
</script>
