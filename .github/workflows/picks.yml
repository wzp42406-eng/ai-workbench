# AI 玩法的 GitHub 项目精选：找最近 star 涨得快的 AI 项目，翻译并总结后推到 picks 分支，
# 页面从 raw.githubusercontent.com 读 picks/picks.json。不改 main，不会和本机脚本的推送冲突。
# 2026-10-30 起每日任务由联想工作机运行（~/AI-Projects/scripts/workbench-picks，Codex CLI 一次调用写中文总结，
# 每天 06:30），这里只留手动触发作为备用（没有 ANTHROPIC_API_KEY 时只有项目列表、没有中文总结）。
# 中文总结需要在仓库 Settings → Secrets and variables → Actions 里加 ANTHROPIC_API_KEY；
# 想换模型就在同一页的 Variables 里加 PICKS_MODEL（例如 claude-haiku-5-5）。
name: GitHub 项目精选
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: picks
  cancel-in-progress: false
jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读上次的结果（总结过的项目不重复调用模型）
        run: git fetch --depth=1 origin picks && git show FETCH_HEAD:picks.json > prev.json || echo '{}' > prev.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install anthropic
      - name: 生成 picks.json
        run: python tools/picks.py --prev prev.json --out picks.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PICKS_MODEL: ${{ vars.PICKS_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: 推到 picks 分支（只保留最新一份）
        run: |
          mkdir pub && cp picks.json pub/ && cd pub
          git init -q -b picks
          git add picks.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm '更新 GitHub 项目精选'
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" picks
        env:
          GITHUB_TOKEN: ${{ github.token }}
